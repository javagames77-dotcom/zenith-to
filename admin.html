<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зеніт-Авто.фото — администратор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f7f7f8; --sf: #ffffff; --chip: #f1f2f4; --bd: #e7e7ea; --tx: #111318; --mu: #6b7280;
  --or: #F38435; --on-or: #111318; --or-soft: #fff1e6;
  --ok: #15803d; --ok-bg: #e8f6ee; --er: #b42318; --er-bg: #fdecec; --wa: #9a4208; --wa-bg: #fff1e6; --bl: #2563eb; --bl-bg: #eef3ff;
  --logo-bg: transparent; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1115; --sf: #171a20; --chip: #232832; --bd: #2c323d; --tx: #e8eaee; --mu: #9aa3b2; --or-soft: #3a2414;
    --ok: #5dd39e; --ok-bg: #173226; --er: #ff8a80; --er-bg: #3a1c1c; --wa: #ffb27a; --wa-bg: #3a2414; --bl: #8fb0ff; --bl-bg: #1a2440;
    --logo-bg: #ffffff; --shadow: none;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--tx); font: 14px/1.45 "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--bl); }
.mono { font-family: "PT Mono", ui-monospace, monospace; font-size: 12.5px; }
.mu { color: var(--mu); }
.nw { white-space: nowrap; }

/* каркас */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--sf); border-bottom: 1px solid var(--bd); }
.top .logo { display: inline-flex; background: var(--logo-bg); border-radius: 6px; padding: 1px; }
.top .logo svg { height: 30px; width: auto; display: block; }
.top b { font-size: 17px; letter-spacing: -.01em; }
.top b span { color: var(--or); }
.top .r { margin-left: auto; color: var(--mu); font-size: 12.5px; }
.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: calc(100vh - 51px); }
.side { background: var(--sf); border-right: 1px solid var(--bd); padding: 12px 10px; }
.side a { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 10px; color: var(--tx); text-decoration: none; margin-bottom: 2px; }
.side a:hover { background: var(--chip); }
.side a.on { background: var(--or-soft); color: var(--wa); font-weight: 700; box-shadow: inset 3px 0 0 var(--or); }
.side a.soon { color: var(--mu); }
.side a.soon::after { content: "скоро"; font-size: 10.5px; background: var(--chip); border-radius: 999px; padding: 0 7px; }
:root[lang="uk"] .side a.soon::after { content: "незабаром"; }
main { padding: 20px 24px 40px; min-width: 0; }
main:focus { outline: none; }
.hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.hd h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.hd .sub { color: var(--mu); margin-top: 2px; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crumb { font-size: 13px; margin-bottom: 6px; }
.crumb a { color: var(--mu); text-decoration: none; }
.crumb a:hover { color: var(--tx); }

/* элементы */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--bd); background: var(--sf); color: var(--tx); font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--mu); }
.btn.pri { background: var(--or); border-color: var(--or); color: var(--on-or); font-weight: 700; }
.btn.pri:hover { filter: brightness(1.05); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
.in { min-height: 38px; border: 1px solid var(--bd); border-radius: 10px; background: var(--sf); padding: 0 12px; min-width: 0; }
textarea.in { padding: 8px 12px; min-height: 64px; width: 100%; resize: vertical; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--tx); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.wa { background: var(--wa-bg); color: var(--wa); } .pill.er { background: var(--er-bg); color: var(--er); } .pill.bl { background: var(--bl-bg); color: var(--bl); }
.card { background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi div { background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; padding: 10px 14px; color: var(--mu); font-size: 12.5px; }
.kpi b { display: block; font-size: 24px; color: var(--tx); line-height: 1.2; }
.kpi .ok b { color: var(--ok); } .kpi .wa b { color: var(--wa); } .kpi .er b { color: var(--er); }
.prog { display: inline-block; width: 110px; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; vertical-align: middle; }
.prog i { display: block; height: 100%; background: var(--or); }
.prog.wide { width: 260px; }
.tw { overflow-x: auto; background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--bd); text-align: left; vertical-align: middle; }
th { color: var(--mu); font-weight: 600; font-size: 12px; background: var(--sf); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--chip); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--bd); margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 8px 12px; color: var(--mu); cursor: pointer; font-weight: 500; }
.tabs button.on { color: var(--tx); font-weight: 700; box-shadow: inset 0 -2px 0 var(--or); }
.thumbs { display: inline-flex; gap: 4px; align-items: center; }
.thumbs img, .thumbs span.ph { width: 34px; height: 34px; border-radius: 7px; object-fit: cover; background: var(--chip); display: block; }
.thumbs img.first { box-shadow: 0 0 0 1.5px var(--or); }
.thumbs em { font-style: normal; color: var(--mu); font-size: 12px; margin-left: 2px; }
.empty { text-align: center; padding: 40px 20px; color: var(--mu); }
.loading { padding: 40px; text-align: center; color: var(--mu); }
.err { background: var(--er-bg); color: var(--er); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
.note { background: var(--wa-bg); color: var(--wa); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }

/* импорт */
.drop { display: block; border: 2px dashed var(--bd); border-radius: 14px; padding: 34px 20px; text-align: center; background: var(--sf); cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--or); background: var(--or-soft); }
.drop b { display: block; font-size: 16px; margin-bottom: 4px; }
.drop span { display: block; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 12px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--mu); }

/* карточка товара */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.gal figure { margin: 0; background: var(--sf); border: 1px solid var(--bd); border-radius: 12px; overflow: hidden; cursor: zoom-in; }
.gal figure.first { box-shadow: 0 0 0 2px var(--or); }
.gal img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--chip); }
.gal figcaption { padding: 7px 9px; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.gal figcaption .fn { font-family: "PT Mono", ui-monospace, monospace; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; font-size: 13px; }
.kv > span:nth-child(odd) { color: var(--mu); }
.st { font-weight: 700; margin: 0 0 10px; }
.acts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

/* просмотр фото */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(10,12,16,.88); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
.lb.on { display: flex; }
.lb img { max-width: 100%; max-height: calc(100vh - 120px); border-radius: 8px; background: #fff; }
.lb .cap { color: #e8eaee; margin-top: 10px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
.lb .cap a { color: #ffb27a; }
.lb .x { position: absolute; top: 14px; right: 18px; background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 10px; width: 40px; height: 40px; font-size: 20px; cursor: pointer; }
.lb .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 10px; width: 44px; height: 64px; font-size: 22px; cursor: pointer; }
.lb .nav.l { left: 14px; } .lb .nav.r { right: 14px; }

/* вход в админку: светлая карточка по центру — нарочно не похожа на тёмный экран входа в приложение фотографа */
.auth { min-height: 100vh; display: none; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); }
body.need-auth .auth { display: flex; }
body.need-auth .top, body.need-auth .layout { display: none; }
.auth-card { width: 100%; max-width: 400px; background: var(--sf); border: 1px solid var(--bd); border-radius: 18px; padding: 30px 28px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.07); }
.auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.auth-brand .logo { display: inline-flex; background: var(--logo-bg); border-radius: 6px; padding: 1px; }
.auth-brand svg { height: 36px; width: auto; display: block; }
.auth-brand b { font-size: 18px; } .auth-brand b span { color: var(--or); }
.auth-badge { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--wa); background: var(--wa-bg); border-radius: 999px; padding: 2px 10px; margin-bottom: 8px; }
.auth h1 { font-size: 22px; margin: 0 0 4px; }
.auth .sub { color: var(--mu); margin: 0 0 18px; }
.auth label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--mu); margin-bottom: 12px; }
.auth .in { width: 100%; min-height: 44px; font-size: 15px; }
.auth .btn.pri { width: 100%; min-height: 46px; font-size: 15px; margin-top: 4px; }
.auth .err { margin: 12px 0 0; }
.auth .foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--bd); color: var(--mu); font-size: 12.5px; }
.top .who { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--mu); font-size: 12.5px; }
.top .who b { color: var(--tx); font-size: 13px; }

/* пользователи */
.panel { background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.panel h2 { font-size: 16px; margin: 0 0 10px; }
.pass { display: flex; gap: 8px; }
.pass .in { flex: 1; font-family: "PT Mono", ui-monospace, monospace; }
.creds { background: var(--ok-bg); color: var(--ok); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.creds code { font-family: "PT Mono", ui-monospace, monospace; font-size: 15px; color: var(--tx); background: var(--sf); border-radius: 6px; padding: 1px 6px; }
.uacts { display: flex; gap: 6px; flex-wrap: wrap; }
.star { color: var(--or); font-size: 16px; }

/* переключатель языка */
.lsw { display: inline-flex; border: 1px solid var(--bd); border-radius: 999px; overflow: hidden; flex: none; }
.lsw button { border: 0; background: none; padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--mu); cursor: pointer; }
.lsw button.on { background: var(--or); color: var(--on-or); }
.auth-card .lsw { float: right; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 60; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .side { display: flex; gap: 4px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--bd); padding: 8px; }
  .side a { flex: none; margin: 0; }
  .side a.soon { display: none; }
  .split { grid-template-columns: 1fr; }
  main { padding: 16px 14px 40px; }
  .prog.wide { width: 160px; }
}
</style>
</head>

<header class="top">
  <span class="logo"><svg viewBox="0 0 384 462" role="img" aria-label="Зеніт-Авто"><use href="#logo"/></svg></span>
  <b>Зеніт-Авто<span>.фото</span></b>
  <span class="who"><span class="lsw" data-lang-switch></span><span id="who"></span><button class="btn sm" type="button" id="logout">Выйти</button></span>
</header>

<div class="layout">
  <nav class="side" aria-label="Разделы">
    <a href="#tasks" data-nav="tasks">Задания</a>
    <a href="#new" data-nav="new">Новое задание</a>
    <a class="soon" aria-disabled="true">Каталог</a>
    <a class="soon" aria-disabled="true">Связки кодов</a>
    <a href="#users" data-nav="users" id="nav-users" hidden>Пользователи</a>
    <a class="soon" aria-disabled="true">Журнал</a>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Просмотр фото">
  <button class="x" type="button" aria-label="Закрыть" data-lb="close">×</button>
  <button class="nav l" type="button" aria-label="Предыдущее фото" data-lb="prev">‹</button>
  <img id="lb-img" alt="">
  <div class="cap" id="lb-cap"></div>
  <button class="nav r" type="button" aria-label="Следующее фото" data-lb="next">›</button>
</div>
<div class="auth" id="auth"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ═══════════════════════════════════════════════════════════
// Зеніт-Авто.фото — админка (пилот)

// ─── Язык интерфейса: украинский / русский ───────────────
// Экраны написаны по-русски, логика не трогается. Этот модуль после каждой отрисовки
// подменяет русские надписи украинскими по словарю (I18N_UK) и правилам с числами (I18N_RX).
// Данные (названия товаров, артикулы, имена) не переводятся: их нет в словаре.
// Выбор языка: профиль пользователя (сервер), до входа — последний выбор на этом устройстве.
const I18N = (() => {
  const KEY = 'zf_lang';
  let lang = 'uk';
  try { lang = localStorage.getItem(KEY) === 'ru' ? 'ru' : 'uk'; } catch (_) {}
  const ATTRS = ['title', 'aria-label', 'placeholder', 'alt'];
  const SKIP = 'script,style,textarea,.mono,[data-noi18n]';
  const misses = new Set();                    // для проверки: русский текст без перевода

  const plUk = (n, a, b, c) => { n = Math.abs(n) % 100; const d = n % 10; if (n > 10 && n < 20) return c; if (d > 1 && d < 5) return b; if (d === 1) return a; return c; };
  function one(s) {
    if (Object.prototype.hasOwnProperty.call(I18N_UK, s)) return I18N_UK[s];
    for (const [re, fn] of I18N_RX) { const m = s.match(re); if (m) return fn(m, plUk); }
    return null;
  }
  // перевод одной строки: целиком, иначе по частям через « · », иначе как есть
  function tr(s) {
    if (s == null) return s;
    const str = String(s);
    if (!/[А-Яа-яЁё]/.test(str)) return str;
    const lead = str.match(/^\s*/)[0], tail = str.match(/\s*$/)[0];
    const core = str.trim();
    let out = one(core);
    if (out === null && core.includes(' · ')) {
      let hit = false;
      const parts = core.split(' · ').map(p => { const t = one(p.trim()); if (t !== null) hit = true; return t === null ? p : t; });
      if (hit) out = parts.join(' · ');
    }
    if (out === null) { misses.add(core); return str; }
    return lead + out + tail;
  }
  const t = s => lang === 'uk' ? tr(s) : s;

  // ── применение к странице ──
  function textNode(n) {
    if (!n.parentElement || n.parentElement.closest(SKIP)) return;
    if (n.__tr !== undefined && n.nodeValue === n.__tr) { /* наш перевод — источник прежний */ }
    else n.__ru = n.nodeValue;
    const want = lang === 'uk' ? tr(n.__ru) : n.__ru;
    n.__tr = want;
    if (n.nodeValue !== want) n.nodeValue = want;
  }
  function element(el) {
    if (el.closest && el.closest(SKIP)) return;
    el.__ruA = el.__ruA || {};
    for (const a of ATTRS) {
      if (!el.hasAttribute(a)) continue;
      const v = el.getAttribute(a);
      if (!(el.__trA && el.__trA[a] === v)) el.__ruA[a] = v;
      const want = lang === 'uk' ? tr(el.__ruA[a]) : el.__ruA[a];
      (el.__trA = el.__trA || {})[a] = want;
      if (v !== want) el.setAttribute(a, want);
    }
  }
  function walk(root) {
    if (root.nodeType === 3) return textNode(root);
    if (root.nodeType !== 1) return;
    if (root.matches && root.matches('script,style')) return;
    element(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
    let n; while ((n = w.nextNode())) { if (n.nodeType === 3) { if (/\S/.test(n.nodeValue)) textNode(n); } else element(n); }
  }
  let busy = false;
  const mo = new MutationObserver(list => {
    if (busy) return; busy = true;
    try {
      for (const m of list) {
        if (m.type === 'characterData') textNode(m.target);
        else if (m.type === 'attributes') element(m.target);
        else m.addedNodes.forEach(walk);
      }
    } finally { mo.takeRecords(); busy = false; }
  });
  function start() {
    document.documentElement.lang = lang;
    walk(document.documentElement);
    mo.observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ATTRS });
    drawSwitches();
  }
  // окна подтверждения тоже на нужном языке
  const _confirm = window.confirm.bind(window), _alert = window.alert.bind(window);
  window.confirm = m => _confirm(t(m));
  window.alert = m => _alert(t(m));

  // ── переключатель «УКР / РУС» ──
  const listeners = [];
  function drawSwitches() {
    document.querySelectorAll('[data-lang-switch]').forEach(box => {
      box.innerHTML = ['uk', 'ru'].map(l => `<button type="button" data-l="${l}" class="${l === lang ? 'on' : ''}" aria-pressed="${l === lang}">${l === 'uk' ? 'УКР' : 'РУС'}</button>`).join('');
      box.querySelectorAll('[data-l]').forEach(b => b.onclick = () => set(b.dataset.l, true));
    });
  }
  function set(l, byUser) {
    l = l === 'ru' ? 'ru' : 'uk';
    const changed = l !== lang;
    lang = l;
    try { localStorage.setItem(KEY, l); } catch (_) {}
    document.documentElement.lang = l;
    busy = true;
    try { walk(document.documentElement); } finally { mo.takeRecords(); busy = false; }
    drawSwitches();
    if (changed || byUser) listeners.forEach(fn => { try { fn(l, byUser); } catch (_) {} });
  }
  return {
    get lang() { return lang; },
    locale() { return lang === 'uk' ? 'uk-UA' : 'ru-RU'; },
    t, tr, set, start, misses,
    onChange(fn) { listeners.push(fn); },
    drawSwitches
  };
})();

const API_BASE = 'https://primary-production-4b93e.up.railway.app/webhook';
const MIN_PHOTOS = 4, MAX_PHOTOS = 14;
const LOW_RES_PX = 2000;          // длинная сторона меньше — «низкое разрешение»

// ─── API ──────────────────────────────────────────────────
// Вход админки хранится отдельно от приложения фотографа (свои ключи), чтобы входы не путались.
const AUTH_KEY = 'zf_admin_token', USER_KEY = 'zf_admin_user';
const Auth = {
  token: null, user: null,
  load() { try { this.token = localStorage.getItem(AUTH_KEY); this.user = JSON.parse(localStorage.getItem(USER_KEY) || 'null'); } catch (_) {} },
  save(token, user) { this.token = token; this.user = user; try { localStorage.setItem(AUTH_KEY, token); localStorage.setItem(USER_KEY, JSON.stringify(user)); } catch (_) {} },
  clear() { this.token = null; this.user = null; try { localStorage.removeItem(AUTH_KEY); localStorage.removeItem(USER_KEY); } catch (_) {} },
  isAdmin() { return !!this.user && this.user.role === 'admin'; }
};
Auth.load();

async function api(path, { method = 'GET', body, auth = true } = {}) {
  let res;
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  if (auth && Auth.token) headers['Authorization'] = 'Bearer ' + Auth.token;
  try {
    res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    throw new Error('Нет связи с сервером');
  }
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (res.status === 401 && auth && Auth.token) {      // вход истёк или отозван — на экран входа
    Auth.clear(); showLogin((data && data.error) || 'Вход истёк, войдите снова');
    throw new Error((data && data.error) || 'Нужно войти');
  }
  if (!res.ok || !data || data.success === false) {
    const e = new Error((data && data.error) || ('Ошибка сервера: ' + res.status));
    e.status = res.status; e.data = data;
    throw e;
  }
  return data;
}

function itemFlags(it) {
  const f = [];

  if (it.status === 'done' && n < MIN_PHOTOS) f.push(['er', n + ' фото']);
  if (n > MAX_PHOTOS) f.push(['wa', 'больше ' + MAX_PHOTOS + ' фото']);

}

}

// ─── Новое задание из Excel ───────────────────────────────
const HEADERS = {
  row_no: ['№з/п', '№п/п', '№', 'n'],
  code_1c: ['код1с8', 'код1с', 'код'],
  name: ['номенклатура', 'наименование', 'назва'],
  cell: ['осн.комірка', 'осн.ячейка', 'комірка', 'ячейка'],
  article: ['артикул'],
  brand: ['бренд', 'производитель', 'виробник'],
  barcode: ['штрихкод', 'штрих-код', 'ean']
};
const normH = s => String(s || '').toLowerCase().replace(/\s+/g, '');
function findCols(row) {
  const cols = {};
  row.forEach((cell, i) => {
    const h = normH(cell);
    if (!h) return;
    for (const [key, aliases] of Object.entries(HEADERS)) {
      if (cols[key] !== undefined) continue;
      if (aliases.some(a => key === 'row_no' ? h === a || h.startsWith(a) && h.length <= 5 : h.startsWith(a))) { cols[key] = i; break; }
    }
  });
  return cols;
}
function parseSheet(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: false });
  let hi = -1, cols = null;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const c = findCols(rows[i]);
    if (c.code_1c !== undefined && c.article !== undefined) { hi = i; cols = c; break; }
  }
  if (hi < 0) throw new Error('Не найдены колонки «Код1С8» и «Артикул» в первых 20 строках первого листа');
  const get = (r, k) => cols[k] === undefined ? '' : String(r[cols[k]] ?? '').trim();
  const out = [];
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    const it = { row_no: get(r, 'row_no'), code_1c: get(r, 'code_1c'), name: get(r, 'name'), article: get(r, 'article'), brand: get(r, 'brand'), cell: get(r, 'cell'), barcode: get(r, 'barcode'), _line: i + 1 };
    if (!it.code_1c && !it.article) continue;       // пустые строки с формулами
    out.push(it);
  }
  // проверки как в шаблоне Excel
  const seenCode = new Map(), seenArt = new Map();
  for (const it of out) {
    it._issues = [];
    if (!it.code_1c) it._issues.push(['er', 'нет кода 1С']);
    if (!it.article) it._issues.push(['er', 'нет артикула']);
    if (it.code_1c) {
      if (seenCode.has(it.code_1c)) it._issues.push(['er', 'дубль кода 1С (строка ' + seenCode.get(it.code_1c) + ')']);
      else seenCode.set(it.code_1c, it._line);
    }
    const an = it.article.toUpperCase().replace(/[\s./-]/g, '');
    if (an) {
      if (seenArt.has(an)) it._issues.push(['wa', 'дубль артикула (строка ' + seenArt.get(an) + ')']);
      else seenArt.set(an, it._line);
    }
    it._level = it._issues.some(x => x[0] === 'er') ? 'er' : it._issues.length ? 'wa' : 'ok';
  }
  return { items: out, sheet: wb.SheetNames[0], cols: Object.keys(cols) };
}

  $('#drop').hidden = true;
  renderPreview(file, parsed);
}

// ─── Итоговый Excel по заданию ───────────────────────────
// Лист «Задание» — колонки исходного шаблона в том же порядке; вместо ручных диапазонов кадров
// пишем то, что знает система: имя первого фото и номера первого и последнего фото товара.
// Лист «Фото» — каждое фото отдельной строкой со ссылками.
const XLS_STATUS = it => I18N.t(it.status === 'done' ? 'снят' : it.status === 'absent' ? 'нет на приёмке'
  : num(it.photos_stored) ? 'снимается' : 'не снят');
function exportTaskXlsx(d) {
  const t = d.task, items = (d.items || []).slice()
    .sort((a, b) => (a.row_no == null ? 1e9 : num(a.row_no)) - (b.row_no == null ? 1e9 : num(b.row_no)) || num(a.id) - num(b.id));
  const stored = it => (it.photos || []).filter(p => p.status === 'stored' && p.file_url)
    .sort((a, b) => num(a.photo_index) - num(b.photo_index));
  const H = ['№ з/п', 'Код1С8', 'Номенклатура', 'Осн. комірка', 'Артикул', 'Бренд', 'Од. вим.', 'В наявності',
    'Файл картинки', 'Нач знач', 'Кон знач', 'Кол-во фото', 'Проверка пересечения диапазонов',
    'Проверка последов-сти номеров', 'Проверка кол-ва фото', 'Проверка дублей код1С', I18N.t('Статус'), I18N.t('Комментарий')];
  const n = items.length, last = n + 1;
  const codeCount = {};
  items.forEach(it => { codeCount[it.code_1c] = (codeCount[it.code_1c] || 0) + 1; });
  const aoa = [H];
  items.forEach(it => {
    const ph = stored(it), cnt = ph.length;
    aoa.push([
      it.row_no == null ? '' : num(it.row_no), it.code_1c || '', it.name || '', it.cell || '', it.article || '', it.brand || '', '', '',
      cnt ? ph[0].file_name : '', cnt ? num(ph[0].photo_index) : '', cnt ? num(ph[cnt - 1].photo_index) : '', cnt || '',
      '', '', '', '', XLS_STATUS(it), it.comment || ''
    ]);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  // формулы шаблона, которые имеют смысл: количество фото и дубли кода 1С (значение посчитано сразу — на случай,
  // если программа не пересчитает формулы при открытии). Проверки диапазонов кадров не нужны: номера выдаёт сервер.
  items.forEach((it, i) => {
    const r = i + 2, cnt = stored(it).length;
    ws['O' + r] = { t: 's', f: `IF(AND(ISNUMBER(L${r}),OR(L${r}>${MAX_PHOTOS},L${r}<=${MIN_PHOTOS - 1})),"Проверьте кол-во","")`,
      v: cnt && (cnt > MAX_PHOTOS || cnt <= MIN_PHOTOS - 1) ? 'Проверьте кол-во' : '' };
    ws['P' + r] = { t: 's', f: `IF(COUNTIF(B$2:B$${last},B${r})>1,"Дублируется","")`, v: codeCount[it.code_1c] > 1 ? 'Дублируется' : '' };
  });
  ws['!cols'] = [6, 14, 48, 12, 16, 12, 8, 10, 30, 9, 9, 10, 14, 14, 16, 14, 15, 30].map(w => ({ wch: w }));
  ws['!autofilter'] = { ref: 'A1:R' + Math.max(last, 1) };

  const P = [['№ з/п', 'Код1С8', 'Артикул', 'Бренд', ...['№ фото', 'Имя файла', 'Оригинал', 'Белый фон', 'Засветка', 'Ширина', 'Высота', 'Размер, МБ', 'Снято'].map(I18N.t)]];
  items.forEach(it => stored(it).forEach(p => P.push([
    it.row_no == null ? '' : num(it.row_no), it.code_1c || '', it.article || '', it.brand || '', num(p.photo_index), p.file_name,
    p.file_url, webUrl(p.file_url), lightUrl(p.file_url), num(p.width) || '', num(p.height) || '',
    p.size_bytes ? Math.round(p.size_bytes / 10485.76) / 100 : '', p.shot_at ? new Date(p.shot_at).toLocaleString('ru-RU') : ''
  ])));
  const wp = XLSX.utils.aoa_to_sheet(P);
  for (let r = 2; r <= P.length; r++) ['G', 'H', 'I'].forEach(c => { const cell = wp[c + r]; if (cell && cell.v) cell.l = { Target: String(cell.v) }; });
  wp['!cols'] = [6, 14, 16, 12, 7, 30, 40, 40, 40, 8, 8, 10, 18].map(w => ({ wch: w }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, I18N.t('Задание'));
  XLSX.utils.book_append_sheet(wb, wp, I18N.t('Фото'));
  const base = String(t.title || I18N.t('задание')).replace(/[\\/:*?"<>|]+/g, '_').trim().slice(0, 80);
  XLSX.writeFile(wb, base + ' — ' + I18N.t('итог') + '.xlsx');
  const done = items.filter(i => i.status === 'done').length;
  toast('Excel готов: снято ' + done + ' из ' + n);
}

// ─── фотографы для выбора ────────────────────────────────
let phCache = null;
async function loadPhotographers(force) {
  if (!phCache || force) phCache = await api('/photo/photographers');
  return phCache;
}
function phOptions(list, selected) {
  return list.map(p => `<option value="${p.id}"${num(p.id) === num(selected) ? ' selected' : ''}>${esc(p.full_name)}</option>`).join('');
}

// ─── Вход в админку ──────────────────────────────────────
const ROLE_RU = { admin: 'администратор', manager: 'менеджер', photographer: 'фотограф' };
const PWA_URL = 'https://zenith-to.onrender.com/paw/';
const authBrand = `<span class="lsw" data-lang-switch></span><div class="auth-brand"><span class="logo"><svg viewBox="0 0 384 462" aria-hidden="true"><use href="#logo"/></svg></span><b>Зеніт-Авто<span>.фото</span></b></div>`;
function drawWho() {
  const u = Auth.user;
  $('#who').innerHTML = u ? '<b>' + esc(u.full_name) + '</b> · ' + esc(ROLE_RU[u.role] || u.role) : '';
  $('#nav-users').hidden = !Auth.isAdmin();
}
function showLogin(msg) {
  document.body.classList.add('need-auth');
  document.title = 'Вход в админку — Зеніт-Авто.фото';
  const box = $('#auth');
  box.innerHTML = `<div class="auth-card">${authBrand}<div class="loading" style="padding:20px 0">Проверяю…</div></div>`;
  I18N.drawSwitches();
  api('/photo/auth/status', { auth: false })
    .then(d => d.has_users ? drawLoginForm(msg) : drawSetupForm())
    .catch(e => { box.innerHTML = `<div class="auth-card">${authBrand}<div class="err">${esc(e.message)}</div><button class="btn" type="button" id="auth-retry">Повторить</button></div>`; $('#auth-retry').onclick = () => showLogin(msg); });
}
function drawLoginForm(msg) {
  $('#auth').innerHTML = `<form class="auth-card" id="admin-login-form" name="admin-login" novalidate>
    ${authBrand}
    <div class="auth-badge">Админка</div>
    <h1>Вход для менеджеров</h1>
    <p class="sub">Задания, проверка фото, пользователи</p>
    <label>Логин<input class="in" id="al-login" name="admin-login-name" autocomplete="section-admin username" autocapitalize="none" spellcheck="false" required></label>
    <label>Пароль<input class="in" id="al-pass" name="admin-login-password" type="password" autocomplete="section-admin current-password" required></label>
    <button class="btn pri" type="submit" id="al-go">Войти в админку</button>
    <div id="al-err"></div>
    <div class="foot">Фотограф? Вам сюда не нужно: войдите в приложение на телефоне — <a href="${PWA_URL}">${PWA_URL.replace('https://', '')}</a></div>
  </form>`;
  I18N.drawSwitches();
  if (msg) $('#al-err').innerHTML = '<div class="note">' + esc(msg) + '</div>';
  const f = $('#admin-login-form');
  f.onsubmit = async e => {
    e.preventDefault();
    const login = $('#al-login').value.trim(), password = $('#al-pass').value;
    if (!login || !password) { $('#al-err').innerHTML = '<div class="err">Введите логин и пароль</div>'; return; }
    const b = $('#al-go'); b.disabled = true; b.textContent = 'Входим…';
    try {
      const d = await api('/photo/auth/login', { method: 'POST', auth: false, body: { login, password, scope: 'admin', device: navigator.userAgent.slice(0, 120) } });
      Auth.save(d.token, d.user); applyProfileLang(); enterApp();
    } catch (err) {
      $('#al-err').innerHTML = '<div class="err">' + esc(err.message) + (err.data && err.data.wrong_app ? `<br><a href="${PWA_URL}">Открыть приложение фотографа</a>` : '') + '</div>';
      b.disabled = false; b.textContent = 'Войти в админку';
    }
  };
  $('#al-login').focus();
}
function drawSetupForm() {
  $('#auth').innerHTML = `<form class="auth-card" id="admin-setup-form" novalidate>
    ${authBrand}
    <div class="auth-badge">Первый запуск</div>
    <h1>Создайте администратора</h1>
    <p class="sub">Пользователей ещё нет. Этот экран появляется один раз: после создания администратора остальных добавляют в разделе «Пользователи».</p>
    <label>Имя и фамилия<input class="in" id="as-name" autocomplete="name" required></label>
    <label>Логин<input class="in" id="as-login" autocomplete="section-admin username" autocapitalize="none" spellcheck="false" placeholder="латиница, например admin" required></label>
    <label>Пароль<input class="in" id="as-pass" type="password" autocomplete="section-admin new-password" placeholder="не меньше 6 символов" required></label>
    <label>Пароль ещё раз<input class="in" id="as-pass2" type="password" autocomplete="section-admin new-password" required></label>
    <button class="btn pri" type="submit" id="as-go">Создать и войти</button>
    <div id="as-err"></div>
  </form>`;
  I18N.drawSwitches();
  $('#admin-setup-form').onsubmit = async e => {
    e.preventDefault();
    const full_name = $('#as-name').value.trim(), login = $('#as-login').value.trim().toLowerCase(), password = $('#as-pass').value;
    const err = m => { $('#as-err').innerHTML = '<div class="err">' + esc(m) + '</div>'; };
    if (password !== $('#as-pass2').value) return err('Пароли не совпадают');
    const b = $('#as-go'); b.disabled = true;
    try {
      const d = await api('/photo/auth/setup', { method: 'POST', auth: false, body: { full_name, login, password } });
      Auth.save(d.token, d.user); applyProfileLang(); enterApp(); toast('Администратор создан');
    } catch (ex) { err(ex.message); b.disabled = false; }
  };
  $('#as-name').focus();
}
// Язык: выбранный до входа на этом устройстве переносится в профиль, иначе берётся из профиля
let langPickedBeforeLogin = false;
function applyProfileLang() {
  const u = Auth.user; if (!u) return;
  if (langPickedBeforeLogin) { langPickedBeforeLogin = false; if (u.lang !== I18N.lang) saveLang(I18N.lang); return; }
  if (u.lang && u.lang !== I18N.lang) I18N.set(u.lang);
}
async function saveLang(l) {
  try { const r = await api('/photo/auth/lang', { method: 'POST', body: { lang: l } }); if (r.user) Auth.save(Auth.token, r.user); }
  catch (e) { toast(e.message); }
}
I18N.onChange((l, byUser) => {
  if (!byUser) return;
  if (!Auth.token) { langPickedBeforeLogin = true; return; }
  saveLang(l);
});
function enterApp() {
  document.body.classList.remove('need-auth');
  document.title = 'Зеніт-Авто.фото — админка';
  $('#auth').innerHTML = '';
  drawWho();
  route();
}
$('#logout').onclick = async () => {
  if (!confirm('Выйти из админки?')) return;
  const t = Auth.token;
  Auth.clear();
  try { await fetch(API_BASE + '/photo/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + t } }); } catch (_) {}
  showLogin();
};
async function boot() {
  if (!Auth.token) return showLogin();
  drawWho();
  try {
    const d = await api('/photo/auth/me?scope=admin');
    Auth.save(Auth.token, d.user); applyProfileLang(); enterApp();
  } catch (e) {
    if (!Auth.token) return;                       // 401 уже показал вход
    if (e.status === 403) { Auth.clear(); return showLogin(e.message); }
    enterApp();                                    // нет сети — работаем с сохранённым входом, API скажет сам
  }
}

// ─── Пользователи (только администратор) ─────────────────
function genPassword() {
  const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
  const a = new Uint32Array(8); crypto.getRandomValues(a);
  return Array.from(a, x => abc[x % abc.length]).join('');
}
let usersPanel = null;   // { kind: 'create'|'edit'|'reset', id }
let usersCreds = null;   // { login, password, full_name } — показать один раз после создания/сброса
async function viewUsers() {
  navOn('users');
  loading();
  let d;
  try { d = await api('/photo/admin/users'); } catch (e) { return showError(e, viewUsers); }
  const users = d.users || [];
  const me = Auth.user ? Auth.user.id : 0;
  const photographers = users.filter(u => u.role === 'photographer' && u.is_active);
  const defaultId = (users.find(u => u.is_default_photographer) || photographers[0] || {}).id;
  const userPill = u => !u.is_active ? '<span class="pill">заблокирован</span>'
    : u.locked ? '<span class="pill er">подбор пароля — пауза 15 мин</span>' : '<span class="pill ok">активен</span>';
  const roleOpts = sel => ['photographer', 'manager', 'admin'].map(r => `<option value="${r}"${r === sel ? ' selected' : ''}>${ROLE_RU[r]}</option>`).join('');
  const editing = usersPanel && usersPanel.id ? users.find(u => u.id === usersPanel.id) : null;

  let panel = '';
  if (usersPanel && usersPanel.kind === 'create') {
    panel = `<form class="panel" id="u-form"><h2>Новый пользователь</h2><div class="form">
      <label>Имя и фамилия<input class="in" id="u-name" required></label>
      <label>Логин<input class="in" id="u-login" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="латиница, например melnik"></label>
      <label>Роль<select class="in" id="u-role">${roleOpts('photographer')}</select></label>
      <label>Временный пароль<span class="pass"><input class="in" id="u-pass" autocomplete="off" value="${genPassword()}"><button class="btn sm" type="button" id="u-gen">Другой</button></span></label>
    </div><div class="bar"><button class="btn pri" type="submit">Создать</button><button class="btn" type="button" id="u-cancel">Отмена</button></div></form>`;
  } else if (usersPanel && usersPanel.kind === 'edit' && editing) {
    const self = editing.id === me;
    panel = `<form class="panel" id="u-form"><h2>Изменить: ${esc(editing.full_name)}</h2><div class="form">
      <label>Имя и фамилия<input class="in" id="u-name" value="${esc(editing.full_name)}"></label>
      <label>Роль<select class="in" id="u-role"${self ? ' disabled' : ''}>${roleOpts(editing.role)}</select></label>
    </div>${self ? '<p class="mu">Свою роль меняет другой администратор.</p>' : '<p class="mu">При смене роли сотрудника выкинет со всех устройств: войти нужно будет заново, уже в своё приложение.</p>'}
    <div class="bar"><button class="btn pri" type="submit">Сохранить</button><button class="btn" type="button" id="u-cancel">Отмена</button></div></form>`;
  } else if (usersPanel && usersPanel.kind === 'reset' && editing) {
    panel = `<form class="panel" id="u-form"><h2>Новый пароль: ${esc(editing.full_name)}</h2><div class="form">
      <label>Пароль<span class="pass"><input class="in" id="u-pass" autocomplete="off" value="${genPassword()}"><button class="btn sm" type="button" id="u-gen">Другой</button></span></label>
    </div><p class="mu">${editing.id === me ? 'Ваш текущий вход сохранится.' : 'Сотрудника выкинет со всех устройств, войти нужно будет с новым паролем.'}</p>
    <div class="bar"><button class="btn pri" type="submit">Сменить пароль</button><button class="btn" type="button" id="u-cancel">Отмена</button></div></form>`;
  }

  const creds = usersCreds ? `<div class="creds"><b>Передайте ${esc(usersCreds.full_name)}:</b> логин <code>${esc(usersCreds.login)}</code> пароль <code>${esc(usersCreds.password)}</code>
    <button class="btn sm" type="button" id="u-copy">Скопировать</button><br><span class="mu">Пароль показывается один раз. ${usersCreds.role === 'photographer' ? 'Фотограф входит в приложение на телефоне: ' + PWA_URL : 'Вход в админку: ' + location.origin + location.pathname}</span></div>` : '';

  const rows = users.map(u => {
    const self = u.id === me;
    const acts = [];
    acts.push(`<button class="btn sm" data-u="edit" data-id="${u.id}">Изменить</button>`);
    acts.push(`<button class="btn sm" data-u="reset" data-id="${u.id}">Пароль</button>`);
    if (u.locked) acts.push(`<button class="btn sm" data-u="unlock" data-id="${u.id}">Снять паузу</button>`);
    if (u.role === 'photographer' && u.is_active && u.id !== defaultId) acts.push(`<button class="btn sm" data-u="default" data-id="${u.id}">По умолчанию</button>`);
    if (u.role === 'photographer' && u.is_active) acts.push(`<button class="btn sm" data-u="push" data-id="${u.id}" title="Пробное уведомление только этому фотографу">🔔 Проверить push</button>`);
    if (num(u.sessions) && !self) acts.push(`<button class="btn sm" data-u="logout_all" data-id="${u.id}">Выйти везде</button>`);
    if (!self) acts.push(u.is_active ? `<button class="btn sm" data-u="block" data-id="${u.id}">Заблокировать</button>` : `<button class="btn sm" data-u="unblock" data-id="${u.id}">Разблокировать</button>`);
    const seen = u.role === 'photographer'
      ? (u.last_device || u.app_version ? esc([u.last_device, u.app_version].filter(Boolean).join(' · ')) + '<div class="mu">' + fmtDate(u.last_seen_at) + '</div>' : '<span class="mu">ещё не входил</span>')
      : (u.last_seen_at ? fmtDate(u.last_seen_at) : '<span class="mu">ещё не входил</span>');
    return `<tr${u.is_active ? '' : ' class="mu"'}>
      <td><b>${esc(u.full_name)}</b>${self ? ' <span class="pill bl">вы</span>' : ''}<div class="mu mono">${esc(u.login)}</div></td>
      <td>${esc(ROLE_RU[u.role] || u.role)}${u.role === 'photographer' && u.id === defaultId ? ' <span class="star" title="Фотограф по умолчанию: подставляется в новые задания">★</span>' : ''}</td>
      <td>${userPill(u)}</td>
      <td>${seen}</td>
      <td><div class="uacts">${acts.join('')}</div></td>
    </tr>`;
  }).join('');

  view.innerHTML = `<div class="hd"><div><h1>Пользователи</h1>
      <div class="sub">Учётные записи создаёт администратор. Фотограф входит в приложение один раз, дальше без пароля. ★ — фотограф по умолчанию для новых заданий.</div></div>
      <div class="bar"><button class="btn pri" type="button" id="u-add">Добавить</button></div></div>
    ${creds}${panel}
    <div class="tw"><table><tr><th>Имя и логин</th><th>Роль</th><th>Статус</th><th>Последний вход</th><th></th></tr>${rows || '<tr><td colspan="5" class="empty">Пользователей нет</td></tr>'}</table></div>`;

  const redraw = () => viewUsers();
  $('#u-add').onclick = () => { usersPanel = { kind: 'create' }; usersCreds = null; redraw(); };
  if ($('#u-copy')) $('#u-copy').onclick = () => {
    const t = I18N.t('Логин') + ': ' + usersCreds.login + '\n' + I18N.t('Пароль') + ': ' + usersCreds.password + '\n' + (usersCreds.role === 'photographer' ? PWA_URL : location.origin + location.pathname);
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Скопировано'), () => toast('Скопируйте вручную'));
  };
  if ($('#u-cancel')) $('#u-cancel').onclick = () => { usersPanel = null; redraw(); };
  if ($('#u-gen')) $('#u-gen').onclick = () => { $('#u-pass').value = genPassword(); };
  if ($('#u-form')) $('#u-form').onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector('.btn.pri'); btn.disabled = true;
    try {
      if (usersPanel.kind === 'create') {
        const body = { action: 'create', full_name: $('#u-name').value.trim(), login: $('#u-login').value.trim().toLowerCase(), role: $('#u-role').value, password: $('#u-pass').value };
        await api('/photo/admin/user-action', { method: 'POST', body });
        usersCreds = { full_name: body.full_name, login: body.login, password: body.password, role: body.role };
      } else if (usersPanel.kind === 'edit') {
        const body = { action: 'update', id: editing.id, full_name: $('#u-name').value.trim() };
        if (editing.id !== me) body.role = $('#u-role').value;
        const r = await api('/photo/admin/user-action', { method: 'POST', body });
        if (editing.id === me && r.user) { Auth.save(Auth.token, r.user); drawWho(); }
        toast('Сохранено');
      } else if (usersPanel.kind === 'reset') {
        const password = $('#u-pass').value;
        await api('/photo/admin/user-action', { method: 'POST', body: { action: 'reset_password', id: editing.id, password } });
        usersCreds = { full_name: editing.full_name, login: editing.login, password, role: editing.role };
      }
      usersPanel = null; redraw();
    } catch (ex) { toast(ex.message); btn.disabled = false; }
  };
  view.querySelectorAll('[data-u]').forEach(b => b.onclick = async () => {
    const id = num(b.dataset.id), u = users.find(x => x.id === id), k = b.dataset.u;
    if (k === 'edit' || k === 'reset') { usersPanel = { kind: k, id }; usersCreds = null; return redraw(); }
    if (k === 'push') {
      b.disabled = true;
      try {
        const r = await api('/photo/push/send', { method: 'POST', body: { user_id: id, kind: 'test', url: '#tasks', tag: 'test' } });
        if (!num(r.devices)) toast('У фотографа не включены уведомления: попросите нажать «Включить уведомления» в приложении');
        else if (num(r.sent)) toast('Доставлено: ' + num(r.sent) + ' из ' + num(r.devices));
        else toast('Не доставлено' + (r.errors && r.errors.length ? ': ' + r.errors[0] : ''));
      } catch (ex) { toast(ex.message); }
      b.disabled = false; return;
    }
    const map = {
      unlock: ['unlock', {}, null],
      default: ['set_default', {}, null],
      logout_all: ['logout_all', {}, 'Выкинуть ' + u.full_name + ' со всех устройств? Войти можно будет снова с тем же паролем.'],
      block: ['set_active', { is_active: false }, 'Заблокировать ' + u.full_name + '? Сотрудника сразу выкинет со всех устройств, войти он не сможет.'],
      unblock: ['set_active', { is_active: true }, null]
    };
    const [action, extra, ask] = map[k];
    if (ask && !confirm(ask)) return;
    b.disabled = true;
    try { await api('/photo/admin/user-action', { method: 'POST', body: { action, id, ...extra } }); usersCreds = null; redraw(); }
    catch (ex) { toast(ex.message); b.disabled = false; }
  });
  if ($('#u-name') && usersPanel && usersPanel.kind === 'create') $('#u-name').focus();
}

// ─── просмотр фото ────────────────────────────────────────
const lb = { list: [], k: 0, back: null };
function openLB(list, k) { lb.list = list; lb.k = k; lb.back = document.activeElement; $('#lb').classList.add('on'); drawLB(); $('#lb .x').focus(); }
function closeLB() { $('#lb').classList.remove('on'); $('#lb-img').src = ''; if (lb.back) lb.back.focus(); }
function drawLB() {
  const p = lb.list[lb.k];
  const img = $('#lb-img');
  img.onerror = () => { if (img.dataset.fallback !== '1') { img.dataset.fallback = '1'; img.src = bigUrl(p.file_url); } };
  img.dataset.fallback = '';
  img.src = bigUrl(pick(p.file_url));
  $('#lb-img').alt = p.file_name;
  $('#lb-cap').innerHTML = `<span class="mono">${esc(p.file_name)}</span><span>${p.width}×${p.height} · ${fmtMP(p.width, p.height)} · ${fmtMB(p.size_bytes)}</span><span>${lb.k + 1} / ${lb.list.length}</span><a href="${esc(p.file_url)}" target="_blank" rel="noopener">Оригинал ↗</a><a href="${esc(webUrl(p.file_url))}" target="_blank" rel="noopener">Белый фон ↗</a><a href="${esc(lightUrl(p.file_url))}" target="_blank" rel="noopener">Засветка ↗</a>`;
}
$('#lb').addEventListener('click', e => {
  const a = e.target.dataset.lb;
  if (a === 'close' || e.target.id === 'lb') closeLB();
  if (a === 'prev') { lb.k = (lb.k - 1 + lb.list.length) % lb.list.length; drawLB(); }
  if (a === 'next') { lb.k = (lb.k + 1) % lb.list.length; drawLB(); }
});
document.addEventListener('keydown', e => {
  if (!$('#lb').classList.contains('on')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') { lb.k = (lb.k - 1 + lb.list.length) % lb.list.length; drawLB(); }
  if (e.key === 'ArrowRight') { lb.k = (lb.k + 1) % lb.list.length; drawLB(); }
});

I18N.start();
boot();
</script>
