<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зеніт-Авто.фото — администратор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f7f7f8; --sf: #ffffff; --chip: #f1f2f4; --bd: #e7e7ea; --tx: #111318; --mu: #6b7280;
  --or: #F38435; --on-or: #111318; --or-soft: #fff1e6;
  --ok: #15803d; --ok-bg: #e8f6ee; --er: #b42318; --er-bg: #fdecec; --wa: #9a4208; --wa-bg: #fff1e6; --bl: #2563eb; --bl-bg: #eef3ff;
  --logo-bg: transparent; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1115; --sf: #171a20; --chip: #232832; --bd: #2c323d; --tx: #e8eaee; --mu: #9aa3b2; --or-soft: #3a2414;
    --ok: #5dd39e; --ok-bg: #173226; --er: #ff8a80; --er-bg: #3a1c1c; --wa: #ffb27a; --wa-bg: #3a2414; --bl: #8fb0ff; --bl-bg: #1a2440;
    --logo-bg: #ffffff; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--tx); font: 14px/1.45 "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--bl); }
.mono { font-family: "PT Mono", ui-monospace, monospace; font-size: 12.5px; }
.mu { color: var(--mu); }
.nw { white-space: nowrap; }

/* каркас */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--sf); border-bottom: 1px solid var(--bd); }
.top .logo { display: inline-flex; background: var(--logo-bg); border-radius: 6px; padding: 1px; }
.top .logo svg { height: 30px; width: auto; display: block; }
.top b { font-size: 17px; letter-spacing: -.01em; }
.top b span { color: var(--or); }
.top .r { margin-left: auto; color: var(--mu); font-size: 12.5px; }
.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: calc(100vh - 51px); }
.side { background: var(--sf); border-right: 1px solid var(--bd); padding: 12px 10px; }
.side a { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 10px; color: var(--tx); text-decoration: none; margin-bottom: 2px; }
.side a:hover { background: var(--chip); }
.side a.on { background: var(--or-soft); color: var(--wa); font-weight: 700; box-shadow: inset 3px 0 0 var(--or); }
.side a.soon { color: var(--mu); }
.side a.soon::after { content: "скоро"; font-size: 10.5px; background: var(--chip); border-radius: 999px; padding: 0 7px; }
main { padding: 20px 24px 40px; min-width: 0; }
main:focus { outline: none; }
.hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.hd h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.hd .sub { color: var(--mu); margin-top: 2px; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crumb { font-size: 13px; margin-bottom: 6px; }
.crumb a { color: var(--mu); text-decoration: none; }
.crumb a:hover { color: var(--tx); }

/* элементы */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--bd); background: var(--sf); color: var(--tx); font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--mu); }
.btn.pri { background: var(--or); border-color: var(--or); color: var(--on-or); font-weight: 700; }
.btn.pri:hover { filter: brightness(1.05); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
.in { min-height: 38px; border: 1px solid var(--bd); border-radius: 10px; background: var(--sf); padding: 0 12px; min-width: 0; }
textarea.in { padding: 8px 12px; min-height: 64px; width: 100%; resize: vertical; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--tx); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.wa { background: var(--wa-bg); color: var(--wa); } .pill.er { background: var(--er-bg); color: var(--er); } .pill.bl { background: var(--bl-bg); color: var(--bl); }
.card { background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi div { background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; padding: 10px 14px; color: var(--mu); font-size: 12.5px; }
.kpi b { display: block; font-size: 24px; color: var(--tx); line-height: 1.2; }
.kpi .ok b { color: var(--ok); } .kpi .wa b { color: var(--wa); } .kpi .er b { color: var(--er); }
.prog { display: inline-block; width: 110px; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; vertical-align: middle; }
.prog i { display: block; height: 100%; background: var(--or); }
.prog.wide { width: 260px; }
.tw { overflow-x: auto; background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--bd); text-align: left; vertical-align: middle; }
th { color: var(--mu); font-weight: 600; font-size: 12px; background: var(--sf); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--chip); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--bd); margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 8px 12px; color: var(--mu); cursor: pointer; font-weight: 500; }
.tabs button.on { color: var(--tx); font-weight: 700; box-shadow: inset 0 -2px 0 var(--or); }
.thumbs { display: inline-flex; gap: 4px; align-items: center; }
.thumbs img, .thumbs span.ph { width: 34px; height: 34px; border-radius: 7px; object-fit: cover; background: var(--chip); display: block; }
.thumbs img.first { box-shadow: 0 0 0 1.5px var(--or); }
.thumbs em { font-style: normal; color: var(--mu); font-size: 12px; margin-left: 2px; }
.empty { text-align: center; padding: 40px 20px; color: var(--mu); }
.loading { padding: 40px; text-align: center; color: var(--mu); }
.err { background: var(--er-bg); color: var(--er); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
.note { background: var(--wa-bg); color: var(--wa); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }

/* импорт */
.drop { display: block; border: 2px dashed var(--bd); border-radius: 14px; padding: 34px 20px; text-align: center; background: var(--sf); cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--or); background: var(--or-soft); }
.drop b { display: block; font-size: 16px; margin-bottom: 4px; }
.drop span { display: block; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 12px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--mu); }

/* карточка товара */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.gal figure { margin: 0; background: var(--sf); border: 1px solid var(--bd); border-radius: 12px; overflow: hidden; cursor: zoom-in; }
.gal figure.first { box-shadow: 0 0 0 2px var(--or); }
.gal img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--chip); }
.gal figcaption { padding: 7px 9px; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.gal figcaption .fn { font-family: "PT Mono", ui-monospace, monospace; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; font-size: 13px; }
.kv > span:nth-child(odd) { color: var(--mu); }
.st { font-weight: 700; margin: 0 0 10px; }
.acts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

/* просмотр фото */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(10,12,16,.88); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
.lb.on { display: flex; }
.lb img { max-width: 100%; max-height: calc(100vh - 120px); border-radius: 8px; background: #fff; }
.lb .cap { color: #e8eaee; margin-top: 10px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
.lb .cap a { color: #ffb27a; }
.lb .x { position: absolute; top: 14px; right: 18px; background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 10px; width: 40px; height: 40px; font-size: 20px; cursor: pointer; }
.lb .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 10px; width: 44px; height: 64px; font-size: 22px; cursor: pointer; }
.lb .nav.l { left: 14px; } .lb .nav.r { right: 14px; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 60; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .side { display: flex; gap: 4px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--bd); padding: 8px; }
  .side a { flex: none; margin: 0; }
  .side a.soon { display: none; }
  .split { grid-template-columns: 1fr; }
  main { padding: 16px 14px 40px; }
  .prog.wide { width: 160px; }
}
</style>
</head>

<header class="top">
  <span class="logo"><svg viewBox="0 0 384 462" role="img" aria-label="Зеніт-Авто"><use href="#logo"/></svg></span>
  <b>Зеніт-Авто<span>.фото</span></b>
  <span class="r">Пилот · администратор</span>
</header>

<div class="layout">
  <nav class="side" aria-label="Разделы">
    <a href="#tasks" data-nav="tasks">Задания</a>
    <a href="#new" data-nav="new">Новое задание</a>
    <a class="soon" aria-disabled="true">Каталог</a>
    <a class="soon" aria-disabled="true">Связки кодов</a>

  <img id="lb-img" alt="">

<script>
// ═══════════════════════════════════════════════════════════
// Зеніт-Авто.фото — админка (пилот)
// ═══════════════════════════════════════════════════════════
const API_BASE = 'https://primary-production-4b93e.up.railway.app/webhook';
const MIN_PHOTOS = 4, MAX_PHOTOS = 14;
const LOW_RES_PX = 2000;          // длинная сторона меньше — «низкое разрешение»

// ─── API ──────────────────────────────────────────────────
async function api(path, { method = 'GET', body } = {}) {
  let res;
  try {
    res = await fetch(API_BASE + path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) {
    throw new Error('Нет связи с сервером');
  }
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok || !data || data.success === false) {
    throw new Error((data && data.error) || ('Ошибка сервера: ' + res.status));
  }
  return data;
}

// ─── утилиты ──────────────────────────────────────────────
const $ = (s, r = document) => r.querySelector(s);
const esc = v => v === null || v === undefined ? '' : String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const num = v => Number(v) || 0;
const fmtDate = s => s ? new Date(s).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const fmtMB = b => b ? (b / 1048576).toFixed(b < 1048576 ? 2 : 1) + ' МБ' : '—';
const fmtMP = (w, h) => w && h ? ((w * h) / 1e6).toFixed(1) + ' Мп' : '—';
function cld(url, t) { return url ? url.replace('/image/upload/', '/image/upload/' + t + '/') : ''; }
const thumbUrl = u => cld(u, 'c_fill,w_120,h_120,q_auto,f_auto');
const midUrl = u => cld(u, 'c_fill,w_420,h_420,q_auto,f_auto');
const bigUrl = u => cld(u, 'c_limit,w_1800,h_1800,q_auto,f_auto');
// «Каталожная» версия на белом фоне: тот же файл с суффиксом _web
const webUrl = u => u ? u.replace(/\/v\d+\//, '/').replace(/(\.[a-z0-9]+)$/i, '_web$1') : '';
let bgMode = 'orig';   // orig | web
try { bgMode = localStorage.getItem('zf-bg') || 'orig'; } catch (_) {}
const pick = u => bgMode === 'web' ? webUrl(u) : u;
const lowRes = p => p.width && p.height && Math.max(p.width, p.height) < LOW_RES_PX;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}
function todayTitle() { return 'Приёмка ' + new Date().toLocaleDateString('ru-RU'); }

function itemFlags(it) {
  const f = [];
  const n = num(it.photos_stored);
  if (it.status === 'done' && n < MIN_PHOTOS) f.push(['er', n + ' фото']);
  if (n > MAX_PHOTOS) f.push(['wa', 'больше ' + MAX_PHOTOS + ' фото']);
  if (num(it.photos_pending)) f.push(['wa', 'в очереди ' + it.photos_pending]);
  if ((it.photos || []).some(lowRes)) f.push(['wa', 'низкое разрешение']);
  return f;
}
function statusPill(it) {
  if (it.status === 'done') return '<span class="pill ok">снят</span>';
  if (it.status === 'absent') return '<span class="pill er">нет на приёмке</span>';

}

// ─── Новое задание из Excel ───────────────────────────────
const HEADERS = {
  row_no: ['№з/п', '№п/п', '№', 'n'],
  code_1c: ['код1с8', 'код1с', 'код'],
  name: ['номенклатура', 'наименование', 'назва'],
  cell: ['осн.комірка', 'осн.ячейка', 'комірка', 'ячейка'],
  article: ['артикул'],
  brand: ['бренд', 'производитель', 'виробник'],
  barcode: ['штрихкод', 'штрих-код', 'ean']
};
const normH = s => String(s || '').toLowerCase().replace(/\s+/g, '');
function findCols(row) {
  const cols = {};
  row.forEach((cell, i) => {
    const h = normH(cell);
    if (!h) return;
    for (const [key, aliases] of Object.entries(HEADERS)) {
      if (cols[key] !== undefined) continue;
      if (aliases.some(a => key === 'row_no' ? h === a || h.startsWith(a) && h.length <= 5 : h.startsWith(a))) { cols[key] = i; break; }
    }
  });
  return cols;
}
function parseSheet(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: false });
  let hi = -1, cols = null;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const c = findCols(rows[i]);
    if (c.code_1c !== undefined && c.article !== undefined) { hi = i; cols = c; break; }
  }
  if (hi < 0) throw new Error('Не найдены колонки «Код1С8» и «Артикул» в первых 20 строках первого листа');
  const get = (r, k) => cols[k] === undefined ? '' : String(r[cols[k]] ?? '').trim();
  const out = [];
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    const it = { row_no: get(r, 'row_no'), code_1c: get(r, 'code_1c'), name: get(r, 'name'), article: get(r, 'article'), brand: get(r, 'brand'), cell: get(r, 'cell'), barcode: get(r, 'barcode'), _line: i + 1 };
    if (!it.code_1c && !it.article) continue;       // пустые строки с формулами
    out.push(it);
  }
  // проверки как в шаблоне Excel
  const seenCode = new Map(), seenArt = new Map();
  for (const it of out) {
    it._issues = [];
    if (!it.code_1c) it._issues.push(['er', 'нет кода 1С']);
    if (!it.article) it._issues.push(['er', 'нет артикула']);
    if (it.code_1c) {
      if (seenCode.has(it.code_1c)) it._issues.push(['er', 'дубль кода 1С (строка ' + seenCode.get(it.code_1c) + ')']);
      else seenCode.set(it.code_1c, it._line);
    }
    const an = it.article.toUpperCase().replace(/[\s./-]/g, '');
    if (an) {
      if (seenArt.has(an)) it._issues.push(['wa', 'дубль артикула (строка ' + seenArt.get(an) + ')']);
      else seenArt.set(an, it._line);
    }
    it._level = it._issues.some(x => x[0] === 'er') ? 'er' : it._issues.length ? 'wa' : 'ok';
  }
  return { items: out, sheet: wb.SheetNames[0], cols: Object.keys(cols) };
}

              ${lowRes(p) ? '<span><span class="pill wa">низкое разрешение</span></span>' : ''}
              <span class="noweb" hidden><span class="pill">белого фона нет</span></span></figcaption>
          </figure>`).join('')}</div>` : '<div class="empty">Фотограф ещё не снял этот товар</div>'}
      </div>
      <div class="card">
        <p class="st">Данные</p>
        <div class="kv">
          <span>Задание</span><span>${esc(d.task.title)}${it.row_no ? ', № ' + esc(it.row_no) : ''}</span>
          <span>Код 1С</span><span class="mono">${esc(it.code_1c)}</span>
          <span>Артикул</span><span class="mono">${esc(it.article)}</span>
          <span>Бренд</span><span>${esc(it.brand || '—')}</span>
          <span>Ячейка</span><span>${esc(it.cell || '—')}</span>
          <span>Статус</span><span>${statusPill(it)}</span>
          <span>Закрыт</span><span>${fmtDate(it.done_at)}</span>
        </div>
        <label class="mu" for="comment" style="display:block;margin:14px 0 4px;font-size:12.5px">Комментарий</label>
        <textarea class="in" id="comment" placeholder="Например: мелкая деталь, хватает 3 фото">${esc(it.comment || '')}</textarea>
        <div class="acts">
          <button class="btn pri" type="button" data-st="done">Отметить снятым</button>
          <button class="btn" type="button" data-st="absent">Нет на приёмке</button>
          <button class="btn" type="button" data-st="todo">Вернуть в работу</button>
        </div>
      </div>
    </div>`;
  view.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => {
    const status = b.dataset.st;
    if (status === 'done' && n < MIN_PHOTOS && !$('#comment').value.trim()) {
      toast('Фото меньше ' + MIN_PHOTOS + ' — укажите причину в комментарии'); $('#comment').focus(); return;
    }
    view.querySelectorAll('[data-st]').forEach(x => x.disabled = true);
    try {
      await api('/photo/item-status', { method: 'POST', body: { item_id: num(it.id), status, comment: $('#comment').value.trim() } });
      await loadTask(taskId);
      toast(status === 'done' ? 'Товар отмечен снятым' : status === 'absent' ? 'Отмечено: нет на приёмке' : 'Товар возвращён в работу');
      viewItem(taskId, itemId);
    } catch (e) { toast(e.message); view.querySelectorAll('[data-st]').forEach(x => x.disabled = false); }
  });
  view.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => {
    bgMode = b.dataset.bg; try { localStorage.setItem('zf-bg', bgMode); } catch (_) {}
    viewItem(taskId, itemId);
  });
  view.querySelectorAll('figure[data-k]').forEach(f => {
    f.onclick = () => openLB(photos, +f.dataset.k);
    f.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLB(photos, +f.dataset.k); } };
  });
}

// ─── просмотр фото ────────────────────────────────────────
const lb = { list: [], k: 0, back: null };
function openLB(list, k) { lb.list = list; lb.k = k; lb.back = document.activeElement; $('#lb').classList.add('on'); drawLB(); $('#lb .x').focus(); }
function closeLB() { $('#lb').classList.remove('on'); $('#lb-img').src = ''; if (lb.back) lb.back.focus(); }
function drawLB() {
  const p = lb.list[lb.k];
  const img = $('#lb-img');
  img.onerror = () => { if (img.dataset.fallback !== '1') { img.dataset.fallback = '1'; img.src = bigUrl(p.file_url); } };
  img.dataset.fallback = '';
  img.src = bigUrl(pick(p.file_url));
  $('#lb-img').alt = p.file_name;
  $('#lb-cap').innerHTML = `<span class="mono">${esc(p.file_name)}</span><span>${p.width}×${p.height} · ${fmtMP(p.width, p.height)} · ${fmtMB(p.size_bytes)}</span><span>${lb.k + 1} / ${lb.list.length}</span><a href="${esc(p.file_url)}" target="_blank" rel="noopener">Оригинал ↗</a><a href="${esc(webUrl(p.file_url))}" target="_blank" rel="noopener">Белый фон ↗</a>`;
}
$('#lb').addEventListener('click', e => {
  const a = e.target.dataset.lb;
  if (a === 'close' || e.target.id === 'lb') closeLB();
  if (a === 'prev') { lb.k = (lb.k - 1 + lb.list.length) % lb.list.length; drawLB(); }
  if (a === 'next') { lb.k = (lb.k + 1) % lb.list.length; drawLB(); }
});
document.addEventListener('keydown', e => {
  if (!$('#lb').classList.contains('on')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') { lb.k = (lb.k - 1 + lb.list.length) % lb.list.length; drawLB(); }
  if (e.key === 'ArrowRight') { lb.k = (lb.k + 1) % lb.list.length; drawLB(); }
});

route();
</script>
</body>
</html>
