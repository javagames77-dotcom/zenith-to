<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зеніт-Авто.фото</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F38435">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Зеніт фото">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Mono&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f7f7f8; --sf: #ffffff; --chip: #f1f2f4; --bd: #e7e7ea; --tx: #111318; --mu: #6b7280;
  --or: #F38435; --on-or: #111318; --or-soft: #fff1e6;
  --ok: #15803d; --ok-bg: #e8f6ee; --er: #b42318; --er-bg: #fdecec; --wa: #9a4208; --wa-bg: #fff1e6; --bl: #2563eb; --bl-bg: #eef3ff;
  --logo-bg: transparent;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1115; --sf: #171a20; --chip: #232832; --bd: #2c323d; --tx: #e8eaee; --mu: #9aa3b2; --or-soft: #3a2414;
    --ok: #5dd39e; --ok-bg: #173226; --er: #ff8a80; --er-bg: #3a1c1c; --wa: #ffb27a; --wa-bg: #3a2414; --bl: #8fb0ff; --bl-bg: #1a2440;
    --logo-bg: #ffffff;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--tx); font: 15px/1.45 "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
button, input, textarea { font: inherit; color: inherit; }
.mono { font-family: "PT Mono", ui-monospace, monospace; }
.mu { color: var(--mu); }
[hidden] { display: none !important; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--sf); border-bottom: 1px solid var(--bd); min-height: 54px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--sf); }
.top .logo { display: inline-flex; background: var(--logo-bg); border-radius: 6px; padding: 1px; flex: none; }
.top .logo svg { height: 26px; width: auto; display: block; }
.top .ttl { font-weight: 700; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .ttl span { color: var(--or); }
.top .back { border: 0; background: var(--chip); border-radius: 10px; min-width: 40px; height: 36px; font-size: 18px; cursor: pointer; flex: none; }
.qchip { margin-left: auto; flex: none; border: 0; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; background: var(--chip); color: var(--mu); cursor: pointer; }
.qchip.wa { background: var(--wa-bg); color: var(--wa); }
.qchip.er { background: var(--er-bg); color: var(--er); }
.qchip.off { background: var(--er-bg); color: var(--er); }

main { padding: 14px 14px 110px; max-width: 720px; margin: 0 auto; }
main:focus { outline: none; }
h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -.01em; }
.sub { color: var(--mu); font-size: 13.5px; }
.card { background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; padding: 12px 14px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--bd); background: var(--sf); color: var(--tx); font-weight: 600; cursor: pointer; text-decoration: none; }
.btn.pri { background: var(--or); border-color: var(--or); color: var(--on-or); font-weight: 700; font-size: 16px; }
.btn.big { min-height: 58px; font-size: 17px; }
.btn:disabled { opacity: .5; }
.btn:focus-visible, .qchip:focus-visible, .back:focus-visible, input:focus-visible, textarea:focus-visible, .row:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.in { width: 100%; min-height: 46px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf); padding: 0 14px; font-size: 16px; }
textarea.in { padding: 10px 14px; min-height: 72px; resize: vertical; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--tx); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.wa { background: var(--wa-bg); color: var(--wa); } .pill.er { background: var(--er-bg); color: var(--er); } .pill.bl { background: var(--bl-bg); color: var(--bl); }
.prog { height: 7px; border-radius: 4px; background: var(--chip); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--or); transition: width .2s; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chips button { flex: none; border: 1px solid var(--bd); background: var(--sf); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; }
.chips button.on { background: var(--tx); color: var(--bg); border-color: var(--tx); font-weight: 600; }
.list { background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--bd); cursor: pointer; text-decoration: none; color: inherit; }
.row:last-child { border-bottom: 0; }
.row:active { background: var(--chip); }
.row .a { font-family: "PT Mono", ui-monospace, monospace; font-weight: 700; font-size: 15px; }
.row .n { grid-column: 1 / -1; color: var(--mu); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { text-align: center; color: var(--mu); padding: 30px 16px; }
.err { background: var(--er-bg); color: var(--er); border-radius: 12px; padding: 10px 14px; }
.note { background: var(--wa-bg); color: var(--wa); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.info { background: var(--bl-bg); color: var(--bl); border-radius: 12px; padding: 10px 14px; font-size: 14px; }

/* товар */
.count { display: flex; justify-content: space-between; align-items: baseline; }
.count b { font-size: 20px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--chip); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph.first { box-shadow: 0 0 0 2px var(--or); }
.ph .b { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: rgba(17,19,24,.72); color: #fff; }
.ph .b.er { background: #b42318; }
.ph .b.ok { background: rgba(21,128,61,.85); }
.ph .n { position: absolute; right: 6px; top: 6px; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 999px; background: rgba(255,255,255,.9); color: #111318; }
.add { aspect-ratio: 1; border-radius: 12px; border: 2px dashed var(--or); background: var(--or-soft); color: var(--wa); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; cursor: pointer; }
.add span { font-size: 28px; line-height: 1; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--sf); border-top: 1px solid var(--bd); padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
.dock .in-dock { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

/* сканер */
.scan { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; flex-direction: column; }
.scan video { flex: 1; width: 100%; height: 100%; object-fit: cover; min-height: 0; }
.scan .frame { position: absolute; left: 10%; right: 10%; top: 32%; height: 22%; border: 3px solid var(--or); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }
.scan .hint { position: absolute; top: calc(18% - 10px); left: 0; right: 0; text-align: center; color: #fff; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.scan .tools { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; display: flex; justify-content: space-between; }
.scan .tools button { border: 0; border-radius: 12px; background: rgba(255,255,255,.18); color: #fff; padding: 10px 14px; font-weight: 600; cursor: pointer; }
.scan .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sf); color: var(--tx); border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 60; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 92vw; text-align: center; }
.toast.on { opacity: 1; }
</style>
</head>
