<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Зеніт-Авто.маршрути — помощник логиста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Mono&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>try { if (localStorage.getItem('zm_theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}</script>
<style>

:root {
  color-scheme: light;
  --bg: #f7f7f8; --sf: #ffffff; --chip: #f1f2f4; --bd: #e7e7ea; --tx: #111318; --mu: #6b7280;
  --or: #F38435; --on-or: #111318; --or-soft: #fff1e6;
  --ok: #15803d; --ok-bg: #e8f6ee; --er: #b42318; --er-bg: #fdecec; --wa: #9a4208; --wa-bg: #fff1e6; --bl: #2563eb; --bl-bg: #eef3ff;
  --logo-bg: transparent; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
/* тёмная тема — только по кнопке в шапке (запоминается на этом компьютере) */
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --sf: #171a20; --chip: #232832; --bd: #2c323d; --tx: #e8eaee; --mu: #9aa3b2; --or-soft: #3a2414;
    --ok: #5dd39e; --ok-bg: #173226; --er: #ff8a80; --er-bg: #3a1c1c; --wa: #ffb27a; --wa-bg: #3a2414; --bl: #8fb0ff; --bl-bg: #1a2440;
    --logo-bg: #ffffff; --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--tx); font: 14px/1.45 "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--bl); }
.mono { font-family: "PT Mono", ui-monospace, monospace; font-size: 12.5px; }
.mu { color: var(--mu); }
.nw { white-space: nowrap; }

/* каркас */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--sf); border-bottom: 1px solid var(--bd); }
.top .logo { display: inline-flex; background: var(--logo-bg); border-radius: 6px; padding: 1px; }
.top .logo svg { height: 30px; width: auto; display: block; }
.top b { font-size: 17px; letter-spacing: -.01em; }
.top b span { color: var(--or); }
.top .r { margin-left: auto; color: var(--mu); font-size: 12.5px; }
.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: calc(100vh - 51px); }
.side { background: var(--sf); border-right: 1px solid var(--bd); padding: 12px 10px; }
.side a { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 10px; color: var(--tx); text-decoration: none; margin-bottom: 2px; }
.side a:hover { background: var(--chip); }
.side a.on { background: var(--or-soft); color: var(--wa); font-weight: 700; box-shadow: inset 3px 0 0 var(--or); }
.side a.soon { color: var(--mu); }
.side .ver { padding: 14px 12px 0; color: var(--mu); font-size: 11.5px; }
.side a.soon::after { content: "скоро"; font-size: 10.5px; background: var(--chip); border-radius: 999px; padding: 0 7px; }
:root[lang="uk"] .side a.soon::after { content: "незабаром"; }
main { padding: 20px 24px 40px; min-width: 0; }
main:focus { outline: none; }
.hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.hd h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.hd .sub { color: var(--mu); margin-top: 2px; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crumb { font-size: 13px; margin-bottom: 6px; }
.crumb a { color: var(--mu); text-decoration: none; }
.crumb a:hover { color: var(--tx); }

/* элементы */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--bd); background: var(--sf); color: var(--tx); font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--mu); }
.btn.pri { background: var(--or); border-color: var(--or); color: var(--on-or); font-weight: 700; }
.btn.pri:hover { filter: brightness(1.05); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
.in { min-height: 38px; border: 1px solid var(--bd); border-radius: 10px; background: var(--sf); padding: 0 12px; min-width: 0; }
textarea.in { padding: 8px 12px; min-height: 64px; width: 100%; resize: vertical; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--tx); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.wa { background: var(--wa-bg); color: var(--wa); } .pill.er { background: var(--er-bg); color: var(--er); } .pill.bl { background: var(--bl-bg); color: var(--bl); }
.card { background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi div { background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; padding: 10px 14px; color: var(--mu); font-size: 12.5px; }
.kpi b { display: block; font-size: 24px; color: var(--tx); line-height: 1.2; }
.kpi .ok b { color: var(--ok); } .kpi .wa b { color: var(--wa); } .kpi .er b { color: var(--er); }
.prog { display: inline-block; width: 110px; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; vertical-align: middle; }
.prog i { display: block; height: 100%; background: var(--or); }
.prog.wide { width: 260px; }
.tw { overflow-x: auto; background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--bd); text-align: left; vertical-align: middle; }
th { color: var(--mu); font-weight: 600; font-size: 12px; background: var(--sf); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--chip); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--bd); margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 8px 12px; color: var(--mu); cursor: pointer; font-weight: 500; }
.tabs button.on { color: var(--tx); font-weight: 700; box-shadow: inset 0 -2px 0 var(--or); }
.thumbs { display: inline-flex; gap: 4px; align-items: center; }
.thumbs img, .thumbs span.ph { width: 34px; height: 34px; border-radius: 7px; object-fit: cover; background: var(--chip); display: block; }
.thumbs img.first { box-shadow: 0 0 0 1.5px var(--or); }
.thumbs em { font-style: normal; color: var(--mu); font-size: 12px; margin-left: 2px; }
.empty { text-align: center; padding: 40px 20px; color: var(--mu); }
.loading { padding: 40px; text-align: center; color: var(--mu); }
.err { background: var(--er-bg); color: var(--er); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
.note { background: var(--wa-bg); color: var(--wa); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }


/* вход в админку: светлая карточка по центру — нарочно не похожа на тёмный экран входа в приложение фотографа */
.auth { min-height: 100vh; display: none; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); }
body.need-auth .auth { display: flex; }
body.need-auth .top, body.need-auth .layout { display: none; }
.auth-card { width: 100%; max-width: 400px; background: var(--sf); border: 1px solid var(--bd); border-radius: 18px; padding: 30px 28px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.07); }
.auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.auth-brand .logo { display: inline-flex; background: var(--logo-bg); border-radius: 6px; padding: 1px; }
.auth-brand svg { height: 36px; width: auto; display: block; }
.auth-brand b { font-size: 18px; } .auth-brand b span { color: var(--or); }
.auth-badge { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--wa); background: var(--wa-bg); border-radius: 999px; padding: 2px 10px; margin-bottom: 8px; }
.auth h1 { font-size: 22px; margin: 0 0 4px; }
.auth .sub { color: var(--mu); margin: 0 0 18px; }
.auth label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--mu); margin-bottom: 12px; }
.auth .in { width: 100%; min-height: 44px; font-size: 15px; }
.auth .btn.pri { width: 100%; min-height: 46px; font-size: 15px; margin-top: 4px; }
.auth .err { margin: 12px 0 0; }
.auth .foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--bd); color: var(--mu); font-size: 12.5px; }
.top .who { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--mu); font-size: 12.5px; }
.top .who b { color: var(--tx); font-size: 13px; }

/* пользователи */
.panel { background: var(--sf); border: 1px solid var(--bd); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.panel h2 { font-size: 16px; margin: 0 0 10px; }
.pass { display: flex; gap: 8px; }
.pass .in { flex: 1; font-family: "PT Mono", ui-monospace, monospace; }
.creds { background: var(--ok-bg); color: var(--ok); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.creds code { font-family: "PT Mono", ui-monospace, monospace; font-size: 15px; color: var(--tx); background: var(--sf); border-radius: 6px; padding: 1px 6px; }
.uacts { display: flex; gap: 6px; flex-wrap: wrap; }


.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 60; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; }


/* ── помощник логиста ── */
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 12px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--mu); }
.xov { position: fixed; inset: 0; z-index: 2000; background: rgba(10,12,16,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
.xbox { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.btn.danger { background: var(--er); border-color: var(--er); color: #fff; font-weight: 700; }
.ck-line { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.sh .t b .sw, .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.mk.edit { width: 26px; height: 26px; background: var(--or); border: 3px solid #fff; box-shadow: 0 0 0 3px var(--or), 0 2px 8px #0008; cursor: grab; }
.map-hint button[disabled] { opacity: .45; cursor: default; }
.mk.num { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; color: #fff; font: 700 11px "Golos Text", sans-serif; }
.km { color: var(--tx); font-weight: 600; }
.lsw { display: inline-flex; border: 1px solid var(--bd); border-radius: 999px; overflow: hidden; flex: none; vertical-align: middle; }
.lsw button { border: 0; background: none; padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--mu); cursor: pointer; }
.lsw button.on { background: var(--or); color: var(--on-or); }
.help { max-width: 860px; }
.help h2 { font-size: 17px; margin: 22px 0 8px; }
.help ol, .help ul { margin: 0; padding-left: 22px; }
.help li { margin: 6px 0; }
.help .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--bd); }
tr.day td { background: var(--chip); font-weight: 700; font-size: 12.5px; padding: 6px 12px; }
.drop { display: block; border: 2px dashed var(--bd); border-radius: 14px; padding: 30px 20px; text-align: center; background: var(--sf); cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--or); background: var(--or-soft); }
.drop b { display: block; font-size: 16px; margin-bottom: 4px; }
.drop.slim { padding: 12px 16px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.drop.slim b { display: inline; font-size: 14px; margin: 0; }
.work { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
.sheets { display: flex; flex-direction: column; gap: 6px; max-height: 560px; overflow: auto; padding-right: 2px; }
.sh { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--bd); border-radius: 12px; background: var(--sf); cursor: pointer; text-align: left; width: 100%; }
.sh:hover { border-color: var(--mu); }
.sh.on { border-color: var(--or); box-shadow: 0 0 0 2px var(--or-soft); }
.sh .t { flex: 1; min-width: 0; }
.sh .t b { display: block; font-size: 13.5px; }
.sh .t span { display: block; color: var(--mu); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mapbox { position: relative; border: 1px solid var(--bd); border-radius: 14px; overflow: hidden; background: var(--sf); }
#map { height: 560px; }
.map-hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 500; background: var(--tx); color: var(--bg); border-radius: 10px; padding: 7px 12px; font-weight: 600; display: none; gap: 10px; align-items: center; }
.map-hint.on { display: flex; }
.map-hint button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 2px 8px; cursor: pointer; }
.geo-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 2px; color: var(--mu); font-size: 12.5px; }
.mk { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px #0006; }
.mk.wh { width: 22px; height: 22px; border-radius: 6px; background: #111318; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.leaflet-container { font: 13px/1.45 "Golos Text", system-ui, sans-serif; }
.zl { background: transparent; border: 0; box-shadow: none; font-weight: 700; font-size: 11px; color: #333; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
.zl::before { display: none; }
td.iss { min-width: 260px; }
.isx { padding: 6px 0; border-top: 1px dashed var(--bd); }
.isx:first-child { border-top: 0; padding-top: 0; }
.isx .ttl { font-weight: 600; }
.isx .txt { color: var(--mu); font-size: 12.5px; }
.isx.er .ttl { color: var(--er); }
.isx.inf .ttl { color: var(--mu); font-weight: 500; }
.verd { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 5px; }
.verd .btn.sm.on-ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.verd .btn.sm.on-false { background: var(--chip); border-color: var(--mu); color: var(--tx); }
.verd input.in { min-height: 30px; font-size: 12.5px; flex: 1; min-width: 120px; padding: 0 8px; }
tr.sel td { background: var(--or-soft); }
tr.er-row td:first-child { box-shadow: inset 3px 0 0 var(--er); }
.addr-note { display: inline-block; font-size: 11px; font-weight: 600; color: var(--bl); background: var(--bl-bg); border-radius: 999px; padding: 0 7px; margin-right: 4px; }
.geo-st { font-size: 12px; margin-top: 3px; }
.geo-st.ok { color: var(--ok); } .geo-st.er { color: var(--er); } .geo-st.wa { color: var(--wa); } .geo-st.mu { color: var(--mu); }
.sum-er { color: var(--er); font-weight: 700; }
.small { font-size: 12.5px; }
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 14px 0 10px; }
.filters .tabs { margin: 0; border: 0; }
.timef { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.timef label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--mu); }
.timef label.ck { flex-direction: row; align-items: center; gap: 6px; color: var(--tx); min-height: 38px; }
.mt { margin-top: 14px; }
@media (max-width: 1100px) { .work { grid-template-columns: 1fr; } .sheets { max-height: 240px; } #map { height: 420px; } }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .side { display: flex; gap: 4px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--bd); padding: 8px; }
  .side a { flex: none; margin: 0; }
  .top { flex-wrap: wrap; padding: 8px 12px; }
  .top .who { flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .tw table { min-width: 760px; }
  main { padding: 16px 14px 40px; }
}
</style>
</head>

<script>
'use strict';
const APP_VERSION = 'm10';           // поднимать при каждой выкладке; видно внизу меню
const API_BASE = 'https://primary-production-4b93e.up.railway.app/webhook';

// ─── разбор Excel маршрутных листов ───────────────────────
// Разбор печатной формы «Маршрутний лист» из 1С (Excel). На входе — строки листа (массив массивов).
function parseRouteSheets(aoa) {
  const toNum = v => typeof v === 'number' ? v : (parseFloat(String(v || '').replace(/\s/g, '').replace(',', '.')) || 0);
  const sheets = []; let cur = null;
  for (const row of aoa) {
    const c = Array.from({ length: 12 }, (_, i) => row[i] === null || row[i] === undefined ? '' : String(row[i]));
    const raw = row;
    const a = c[0].trim();
    if (a.startsWith('МАРШРУТНИЙ ЛИСТ')) {
      const m = a.match(/№\s*(\d+)\s*від\s*([\d.]+)/u);
      cur = { no: m ? m[1] : String(sheets.length + 1), date: m ? m[2] : '', route: '', driver: '', car: '', dep: '', total: 0, brutto: 0, rows: [] };
      sheets.push(cur);
    } else if (!cur) continue;
    else if (a.startsWith('Маршрут:')) cur.route = a.split(':').slice(1).join(':').trim();
    else if (a.startsWith('Водій:')) cur.driver = a.split(':').slice(1).join(':').trim();
    else if (a.startsWith('Автомобіль:')) cur.car = a.split(':').slice(1).join(':').trim();
    else if (a.startsWith('Час виїзду:')) cur.dep = a.split(':').slice(1).join(':').trim();
    else if (a.startsWith('Итого брутто')) cur.brutto = toNum(a.split(':')[1]);
    else if (a.startsWith('Итого:')) { cur.total = toNum(raw[5]); cur.places = c[6]; }
    else if (/^\d+$/.test(a)) {
      const inv = c[3].split(',');
      cur.rows.push({ n: Number(a), client: c[1].trim(), addr: c[2].trim(), inv: inv[0].trim(), manager: inv.length > 1 ? inv[1].trim() : '',
        bg: c[4], sum: toNum(raw[5]), places: c[6], pay: c[7], mark: c[8].trim(), note: c[9].trim() });
    }
  }
  return sheets;
}

// ═══ Разбор Excel «График маршрутов» (все филиалы) ═══════════════════
// Вход: [{ name: 'Сумы 20.09.2026', aoa: [[ячейки строки], …] }, …] — листы книги.
// Выход: { branches: [{ name, city, date, sheet, prefixes, routes: [{ code, key, kind, why, days, times, text, places }] }] }
// kind: city — по городу (по карте зон), route — по списку населённых пунктов, skip — не проверяем (почта, самовывоз, автобус, перемещение).
// Из нескольких листов одного филиала берём самый свежий по дате в названии.

const SCH_DAYS = { 'понедельник': 'Пн', 'понеділок': 'Пн', 'вторник': 'Вт', 'вівторок': 'Вт', 'среда': 'Ср', 'середа': 'Ср', 'четверг': 'Чт', 'четвер': 'Чт',
  'пятница': 'Пт', "п'ятниця": 'Пт', 'пʼятниця': 'Пт', 'суббота': 'Сб', 'субота': 'Сб', 'воскресенье': 'Нд', 'воскреснье': 'Нд', 'неділя': 'Нд' };
const SCH_CODE = /^([А-ЯІЇЄҐA-Z][А-Яа-яІіЇїЄєҐґA-Za-z]{0,3}(?:\([^()\s]{1,4}\))?(?:-[^\s-]+)+)/u;
const SCH_TIME = /^\d{1,2}:\d{2}(:\d{2})?$/;

function schCell(v) {
  if (v === null || v === undefined) return '';
  if (v instanceof Date) return v.toISOString();
  return String(v).replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
}
function schSheetName(title) {           // 'Днепр(У) 17.04.2025' → { name: 'Днепр(У)', city: 'Днепр', date }
  const t = String(title).trim();
  const m = t.match(/^(.*?)\s+(\d{1,2})\.(\d{1,2})\.(\d{2,4})\s*$/u);
  const name = (m ? m[1] : t).trim();
  let date = '', ts = 0;
  if (m) { const y = m[4].length === 2 ? '20' + m[4] : m[4]; date = `${m[2].padStart(2, '0')}.${m[3].padStart(2, '0')}.${y}`; ts = Date.UTC(+y, +m[3] - 1, +m[2]); }
  return { name, city: name.replace(/\s*\(.*?\)\s*/gu, '').trim(), date, ts };
}
function schKind(code, text, city, pure) {
  const c = code.toLowerCase(), t = text.toLowerCase(), all = c + ' ' + t;
  if (/пошт|почт/u.test(c) || /^отправка\s+(почт|посил)/u.test(t)) return ['skip', 'почта'];
  if (/самовив|самовыв/u.test(all)) return ['skip', 'самовывоз'];
  if (/автобус|маршрутк|(^|-)мтс(-|$)/u.test(c) || /^(отправка|передача)\s.*(автобус|маршрут)/u.test(t)) return ['skip', 'автобус / маршрутка'];
  if (/переміщ|перемещ|транзит/u.test(all) || /со склада.*на (склад|точку)/u.test(t) || /^[^-]+-[^-]+\([^)]+\)-/u.test(c) && /склад/u.test(t)) return ['skip', 'перемещение между складами'];
  const seg = String(pure || code).split('-');
  if (seg.length === 2 && /^[А-ЯІЇЄҐа-яіїєґ']{5,}$/u.test(seg[1])) return ['skip', 'перемещение между филиалами'];   // ПвС-Харків
  if (/резерв/u.test(all)) return ['skip', 'резерв'];
  if (/соглас|разгранич|розгранич|рогранич|рогрнанич|интерактивн/u.test(t)) return ['city', ''];
  return ['route', ''];
}
// населённые пункты из текста «Города»
function schPlaces(text) {
  let t = String(text || '').replace(/ /g, ' ');
  t = t.replace(/\(?https?:\/\/\S+\)?/gu, ' ').replace(/\+\s*исключение клиент:.*$/iu, '');
  // скобки: «Ватутино(Багачево)» — второе название; «( от 3000 тыс.)», «(Золотоношского р-на)» — выбрасываем
  t = t.replace(/\(([^()]*)\)/gu, (m, x) => {
    x = x.trim();
    if (!x || /\d|р-н|обл|рын|склад|достав|отправ|оптов|клиент|автобус|дополн|центральн|согласн/iu.test(x) || x.split(/[\s,]+/).length > 2 || !/^[А-ЯІЇЄҐ]/u.test(x)) return ' ';
    return ' ⟨' + x + '⟩';
  });
  t = t.replace(/(^|[\s,])(Доставка|доставка)\s+(по|в|с\s+\S+\s+в)\s+/gu, ' ');
  t = t.replace(/(разграничени\S*|розграничени\S*|рограничени\S*|согласн\S*|интерактивн\S*|карт[аеыиу](?![\p{L}])|поселки|города(?![\p{L}]))/giu, ' ');
  t = t.replace(/(Рын[оке]+к|рын[оке]+к|Авторынок|авторынок|Ринок|ринок)\s+[^,;]+/gu, ' ');
  t = t.replace(/Кр Рог/gu, 'Кривой Рог').replace(/Церкввь/gu, 'Церковь');
  const out = [], seen = new Set();
  for (let p of t.split(/[,;/.]+/u)) {
    let alt = '';
    const ma = p.match(/⟨(.+?)⟩/u); if (ma) { alt = ma[1].trim(); p = p.replace(/⟨.+?⟩/gu, ''); }
    p = p.replace(/[()]/g, ' ').replace(/^\s*(пос|с|смт|пгт|г|м)\.?\s+/iu, '').replace(/\s+/g, ' ').trim().replace(/^[\s\-.:]+|[\s\-.:]+$/gu, '');
    { const ws0 = p.split(' '); const lo = ws0.findIndex((w, i) => i > 0 && /^[а-яіїєґ]/u.test(w)); if (lo > 0) p = ws0.slice(0, lo).join(' '); }
    if (SCH_STOP.test(p)) continue;
    if (!p || p.length < 3 || /\d/.test(p) || /р-на|обл$|^стар$/iu.test(p)) continue;
    if (p.split(' ').length > 3 || !/^[А-ЯІЇЄҐ]/u.test(p) || /[:+]/.test(p)) continue;
    // «Константиновка Шпола», «Городище Стеблев» — запятую забыли: два пункта. «Великая Рублевка», «Кривой Рог» — один
    const ws = p.split(' ');
    const parts = ws.length === 2 && ws.every(w => /^[А-ЯІЇЄҐ]/u.test(w)) && !ws.some(w => SCH_ADJ.test(w)) ? ws : [p];
    parts.forEach((x, i) => {
      if (SCH_STOP.test(x) || seen.has(x)) return; seen.add(x);
      out.push(alt && i === parts.length - 1 ? { name: x, alt } : { name: x });
    });
  }
  return out;
}
const SCH_STOP = /^(На|По|В|С|До|Для|Из|Від|Та|И|Доставка|Отправка|Перевозка|Передача|Склад)$/u;
const SCH_ADJ = /(ая|яя|ий|ой|ые|ое|ый|ее|ие|ій|ья|ьи)$/u;
const schSkel = s => schKey(s).replace(/[аеиоуюяэ]/g, '');
const schKey = s => String(s || '').toLowerCase().replace(/[іїй]/g, 'и').replace(/є/g, 'е').replace(/ґ/g, 'г').replace(/ы/g, 'и').replace(/[ьъ'’ʼ`\s]/g, '');

function parseSchedule(sheets) {
  const byName = {};
  for (const sh of sheets || []) {
    const info = schSheetName(sh.name);
    const routes = {}, order = [];
    let day = '';
    for (const raw of sh.aoa || []) {
      const row = (raw || []).map(schCell);
      if (!row.some(Boolean)) continue;
      for (const c of row) {
        const k = c.toLowerCase().replace(/[’ʼ]/g, "'");
        if (SCH_DAYS[k]) day = SCH_DAYS[k];
        else if (/будни/iu.test(c) && c.length < 30) day = 'Будни';
      }
      let ci = -1, m = null;
      for (let i = 0; i < row.length; i++) { m = row[i].match(SCH_CODE); if (m && !/^(Закрит|Закрит)/u.test(row[i])) { ci = i; break; } }
      if (ci < 0) continue;
      const cell = row[ci], code = m[1].replace(/[.,]+$/, '');
      const tm = cell.match(/(\d{1,2}:\d{2})/);
      let text = '';
      for (let i = ci + 1; i < row.length; i++) { if (row[i] && !SCH_TIME.test(row[i]) && !/^\d{4}-\d\d-\d\dT/.test(row[i])) { text = row[i]; break; } }
      const [kind, why] = schKind(cell, text, info.city, code);
      const key = schKey(code);
      let r = routes[key];
      if (!r) { r = routes[key] = { code, key, kind, why, days: [], times: [], text, places: [] }; order.push(key); }
      if (day && !r.days.includes(day)) r.days.push(day);
      if (tm && !r.times.includes(tm[1])) r.times.push(tm[1]);
      if (kind === 'skip' && r.kind !== 'skip') continue;            // тот же код, но почта — не портит маршрут
      if (r.kind === 'skip' && kind !== 'skip') { r.kind = kind; r.why = ''; r.text = text; }
      if (kind === 'city') { r.kind = 'city'; if (!r.city) { const p0 = schPlaces(text.split(/соглас|разгранич|розгранич|рогранич|рогрнанич|интерактивн/iu)[0])[0]; if (p0) r.city = p0.name; } }
      if (text.length > r.text.length) r.text = text;
      if (r.kind === 'route') for (const p of schPlaces(text)) if (!r.places.some(x => x.name === p.name)) r.places.push(p);
    }
    const list = order.map(k => routes[k]);
    // маршрут только по своему городу («Нежин», «Павлоград (доставка со склада…)») — городской
    const ck = schKey(info.city);
    for (const r of list) {
      if (r.kind === 'route' && r.places.length && r.places.every(p => schKey(p.name).slice(0, 5) === ck.slice(0, 5))) { r.kind = 'city'; r.places = []; r.city = info.city; }
      if (r.kind === 'route' && !r.places.length) { r.kind = 'skip'; r.why = 'нет списка населённых пунктов'; }
    }
    const sk = schSkel(info.city).slice(0, 4);
    for (const r of list) if (r.kind === 'city' && (!r.city || schSkel(r.city).slice(0, 4) === sk)) r.city = info.city;   // «по Белой Церкви» → Белая Церковь
    if (!list.length) continue;
    const cnt = {};
    for (const r of list) { const p = r.code.split('-')[0]; cnt[p] = (cnt[p] || 0) + 1; }
    const prefixes = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
    const b = { name: info.name, city: info.city, date: info.date, ts: info.ts, sheet: sh.name, prefixes, routes: list };
    if (!byName[info.name] || byName[info.name].ts <= info.ts) byName[info.name] = b;
  }
  const branches = Object.values(byName).sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  branches.forEach(b => delete b.ts);
  return { branches };
}


// ─── язык: украинский / русский ───────────────────────────
const LANG_KEY = 'zm_lang';
let lang = (() => { try { return localStorage.getItem(LANG_KEY) === 'ru' ? 'ru' : 'uk'; } catch (_) { return 'uk'; } })();
document.documentElement.lang = lang;
const T = (ru, uk) => lang === 'uk' ? uk : ru;
const TI = (o, f) => lang === 'uk' && o[f + '_uk'] ? o[f + '_uk'] : o[f];   // поле с переводом от сервера
const lswHtml = () => `<span class="lsw"><button type="button" data-lang="uk" class="${lang === 'uk' ? 'on' : ''}">UA</button><button type="button" data-lang="ru" class="${lang === 'ru' ? 'on' : ''}">RU</button></span>`;
function drawChrome() {
  const N = { check: T('Проверка листов', 'Перевірка листів'), fix: T('Исправить адрес в 1С', 'Виправити адресу в 1С'), stats: T('Итоги пилота', 'Підсумки пілоту'),

const AUTH_KEY = 'zm_token', USER_KEY = 'zm_user', LAST_KEY = 'zm_last';
const Auth = {
  token: null, user: null,
  load() { try { this.token = localStorage.getItem(AUTH_KEY); this.user = JSON.parse(localStorage.getItem(USER_KEY) || 'null'); } catch (_) {} },
  save(token, user) { this.token = token; this.user = user; try { localStorage.setItem(AUTH_KEY, token); localStorage.setItem(USER_KEY, JSON.stringify(user)); } catch (_) {} },
  clear() { this.token = null; this.user = null; try { localStorage.removeItem(AUTH_KEY); localStorage.removeItem(USER_KEY); } catch (_) {} },
  isAdmin() { return !!this.user && this.user.role === 'admin'; }
};
Auth.load();

async function api(path, { method = 'GET', body, auth = true } = {}) {
  let res;
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  if (auth && Auth.token) headers['Authorization'] = 'Bearer ' + Auth.token;
  try { res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error(T('Нет связи с сервером', 'Немає звʼязку з сервером')); }
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (res.status === 401 && auth && Auth.token) {
    Auth.clear(); showLogin(trSrv((data && data.error) || 'Вход истёк, войдите снова'));
    throw new Error(trSrv((data && data.error) || 'Нужно войти'));
  }
  if (!res.ok || !data || data.success === false) {
    const e = new Error(trSrv(data && data.error) || (T('Ошибка сервера: ', 'Помилка сервера: ') + res.status));
    e.status = res.status; e.data = data; throw e;
  }
  return data;
}

function ask({ title, text = '', ok = T('Да', 'Так'), cancel = T('Отмена', 'Скасувати'), danger = false, check = '' }) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'xov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    ov.innerHTML = `<div class="card xbox"><h2 style="margin:0;font-size:18px">${esc(title)}</h2>${text ? `<div>${text}</div>` : ''}
      ${check ? `<label class="ck-line"><input type="checkbox" id="ask-ck" checked> ${esc(check)}</label>` : ''}
      <div class="bar" style="justify-content:flex-end"><button class="btn" type="button" data-a="0">${esc(cancel)}</button>
      <button class="btn ${danger ? 'danger' : 'pri'}" type="button" data-a="1">${esc(ok)}</button></div></div>`;
    const done = v => { document.removeEventListener('keydown', onKey); ov.remove(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(false); };
    ov.onclick = e => {
      if (e.target === ov) return done(false);
      const b = e.target.closest('[data-a]'); if (!b) return;
      done(b.dataset.a === '1' ? { checked: !!(ov.querySelector('#ask-ck') || {}).checked } : false);
    };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    ov.querySelector('[data-a="1"]').focus();
  });
}

    return out;
  },
  key(s) { const w = whOf(s) || [0, 0]; return s.no + '|' + w[0].toFixed(5) + ',' + w[1].toFixed(5) + '|' + this.pts(s).map(p => p.c[0].toFixed(5) + ',' + p.c[1].toFixed(5)).join(';'); },
  of(s) { return R && R.routes ? R.routes[this.key(s)] || null : null; },
  straight(pts) {                // запасной вариант: ближайший сосед, по прямой
    const wh = this.wh, left = pts.slice(), order = []; let cur = wh, km = 0;
    while (left.length) { left.sort((a, b) => hav(cur, a.c) - hav(cur, b.c)); const p = left.shift(); km += hav(cur, p.c); cur = p.c; order.push(p); }
    km += hav(cur, wh);
    return { line: [wh, ...order.map(p => p.c), wh], km: km * 1.3, min: km * 1.3 / 30 * 60, order: order.map(p => p.q), straight: true };
  },
  async osrm(pts) {
    const all = [this.wh, ...pts.map(p => p.c)];
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 12000);
    try {
      const u = 'https://router.project-osrm.org/trip/v1/driving/' + all.map(c => c[1].toFixed(6) + ',' + c[0].toFixed(6)).join(';') + '?source=first&roundtrip=true&overview=full&geometries=geojson';
      const d = await (await fetch(u, { signal: ctl.signal })).json();
      if (d.code !== 'Ok') throw 0;
      const wp = d.waypoints.slice(1).map((w, i) => ({ q: pts[i].q, o: w.waypoint_index })).sort((a, b) => a.o - b.o);
      return { line: d.trips[0].geometry.coordinates.map(c => [c[1], c[0]]), km: d.trips[0].distance / 1000, min: d.trips[0].duration / 60, order: wp.map(x => x.q) };
    } finally { clearTimeout(tm); }
  },
  async osrmLine(pts) {           // межгород: склад → ближайший → … → дальний; обратно тем же путём
    const wh = this.wh, left = pts.slice(), order = []; let cur = wh;
    while (left.length) { left.sort((a, b) => hav(cur, a.c) - hav(cur, b.c)); const p = left.shift(); cur = p.c; order.push(p); }
    const all = [wh, ...order.map(p => p.c)];
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 12000);
    try {
      const u = 'https://router.project-osrm.org/route/v1/driving/' + all.map(c => c[1].toFixed(6) + ',' + c[0].toFixed(6)).join(';') + '?overview=full&geometries=geojson';
      const d = await (await fetch(u, { signal: ctl.signal })).json();
      if (d.code !== 'Ok') throw 0;
      return { line: d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]), km: d.routes[0].distance / 1000 * 2, min: d.routes[0].duration / 60 * 2, order: order.map(p => p.q), back: true };
    } catch (_) {
      let km = 0; for (let i = 1; i < all.length; i++) km += hav(all[i - 1], all[i]);
      return { line: all, km: km * 1.3 * 2, min: km * 1.3 * 2 / 50 * 60, order: order.map(p => p.q), back: true, straight: true };
    } finally { clearTimeout(tm); }
  },
  async build(run) {
    if (!R) return;
    if (this.busy) { this.again = true; return; }
    R.routes = R.routes || {};
    this.busy = true; drawGeoLine();
    try {
      for (const s of R.report.sheets) {
        if (run !== Geo.run) break;
        const pts = this.pts(s), k = this.key(s);
        this.wh = whOf(s);
        if (!pts.length || !this.wh || R.routes[k]) continue;
        let rt;
        if (s.type === 'inter') rt = await this.osrmLine(pts);
        else { try { rt = await this.osrm(pts); } catch (_) { rt = this.straight(pts); } }
        R.routes[k] = rt;
        saveLast(); drawSheets(); drawMap(false);
        await sleep(1100);
      }
    } finally { this.busy = false; drawGeoLine(); if (this.again) { this.again = false; this.build(Geo.run); } }
  }
};

const Geo = {
  running: false, pause: false, run: 0,
  stop() { this.run++; this.running = false; },
  async start() {
    if (!R) return;
    const my = ++this.run; this.running = true; this.pause = false;
    // сначала сохраняем зоны по уже известным адресам и находим склады без координат
    prepPlaces();
    await this.send(null);
    await findWarehouses();
    if (my !== this.run) return;
    const qs = [...new Set(R.report.sheets.flatMap(s => s.rows.map(r => r.q)).filter(q => q && !R.geo[q]))];
    let batch = [];
    for (const q of qs) {
      if (my !== this.run || this.pause) break;
      R.geo[q] = await geocode(q);
      if (my !== this.run) return;
      batch.push(q);
      refreshAll();
      if (batch.length >= 5) { this.send(batch); batch = []; }
      await sleep(1100);
    }
    if (my !== this.run) return;
    this.running = false;
    if (batch.length) await this.send(batch);
    saveLast(); refreshAll();
    Routes.build(my);
  },
  // отправить найденные точки и результат проверки зон по затронутым накладным (q = null — по всем)
  async send(qs) {
    if (!R) return;
    const set = qs ? new Set(qs) : null, items = [], rows = [], zone = [];
    if (qs) qs.forEach(q => { const g = R.geo[q]; if (g && g.src !== 'справочник') items.push({ q, lat: g.lat, lng: g.lng, house: g.house, label: g.label, src: g.src, nf: g.nf, manual: g.manual }); });
    for (const s of R.report.sheets) for (const r of s.rows) {
      if (s.type !== 'city' || !r.q || !R.geo[r.q] || (set && !set.has(r.q))) continue;
      rows.push({ date: s.date, no: s.no, n: r.n });
      const z = zoneStatus(s, r);
      if (z.issue) zone.push({ date: s.date, no: s.no, n: r.n, ...z.issue });
    }
    if (!items.length && !rows.length) return;
    try { await api('/logist/geo', { method: 'POST', body: { items, rows, zone } }); } catch (e) { if (e.status !== 401) toast(T('Не удалось сохранить точки: ', 'Не вдалося зберегти точки: ') + e.message); }
  }
};

// ═══ Карты зон (загружает логист: KMZ/KML из Google My Maps) ═══
let zPrev = null, zMap = null;
function parseKml(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  const zones = [], points = {};
  const coords = el => (el ? el.textContent.trim().split(/\s+/) : []).map(t => t.split(',').map(Number)).filter(c => c.length >= 2 && isFinite(c[0]) && isFinite(c[1])).map(c => [Math.round(c[1] * 1e5) / 1e5, Math.round(c[0] * 1e5) / 1e5]);
  for (const pm of Array.from(doc.getElementsByTagName('Placemark'))) {
    const nm = (pm.getElementsByTagName('name')[0] || {}).textContent;
    const name = String(nm || '').trim();
    for (const pg of Array.from(pm.getElementsByTagName('Polygon'))) {
      const ob = pg.getElementsByTagName('outerBoundaryIs')[0];
      const c = coords(ob && ob.getElementsByTagName('coordinates')[0]);
      if (c.length >= 3) zones.push([name, c]);
    }
    const pt = pm.getElementsByTagName('Point')[0];
    if (pt) { const c = coords(pt.getElementsByTagName('coordinates')[0]); if (c.length) points[name] = c[0]; }
  }
  return { zones, points };
}
async function readZoneFile(f) {
  if (/\.kmz$/i.test(f.name)) {
    const zip = await JSZip.loadAsync(await f.arrayBuffer());
    const k = Object.keys(zip.files).find(n => /\.kml$/i.test(n));
    if (!k) throw new Error(T('В KMZ нет файла KML', 'У KMZ немає файлу KML'));
    return parseKml(await zip.files[k].async('string'));
  }
  return parseKml(await f.text());
}

  return bookCache;

  try {

    bk = parseSchedule(wb.SheetNames.map(n => ({ name: n, aoa: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: false }) })));
  } catch (e) { out.innerHTML = '<div class="err">' + T('Не удалось прочитать файл: ', 'Не вдалося прочитати файл: ') + esc(e.message) + '</div>'; return; }
  if (!bk.branches.length) { out.innerHTML = '<div class="err">' + T('В файле не нашёл маршрутов. Нужен Excel «График маршрутов»: в каждой строке код маршрута (например «Смм-0-1 8:15») и города.', 'У файлі не знайшов маршрутів. Потрібен Excel «Графік маршрутів»: у кожному рядку код маршруту (наприклад «Смм-0-1 8:15») і міста.') + '</div>'; return; }
  for (const b of bk.branches) for (const r of b.routes) r.text = String(r.text || '').slice(0, 300);
  bPrev = { file: f.name, data: bk };
  const old = bookBranches(bookCache);
  out.innerHTML = `<div class="panel mt"><h2>${T('Проверьте график перед сохранением', 'Перевірте графік перед збереженням')}</h2>
    <p>${esc(f.name)}: <b>${bk.branches.length}</b> ${T('филиалов', 'філій')}. ${T('Если у филиала несколько листов, взят самый свежий по дате в названии листа.', 'Якщо у філії кілька аркушів, взято найсвіжіший за датою в назві аркуша.')}</p>
    <div class="tw"><table><thead><tr><th>${T('Филиал', 'Філія')}</th><th>${T('Лист', 'Аркуш')}</th><th>${T('Город', 'Місто')}</th><th>${T('Межгород', 'Міжмісто')}</th><th>${T('Не проверяем', 'Не перевіряємо')}</th><th>${T('Было', 'Було')}</th></tr></thead><tbody>
    ${bk.branches.map(b => { const k = kindCounts(b), o = old.find(x => x.name === b.name);
      return `<tr><td><b>${esc(b.name)}</b></td><td>${esc(b.sheet)}</td><td>${k.city}</td><td>${k.route}</td><td>${k.skip}</td><td class="mu small">${o ? esc(o.date || '') + ' · ' + o.routes.length + ' ' + T('маршр.', 'маршр.') : T('новый', 'нова')}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="bar mt"><button class="btn pri" type="button" id="b-ok">${T('Сохранить график', 'Зберегти графік')}</button><button class="btn" type="button" id="b-no">${T('Отмена', 'Скасувати')}</button></div></div>`;
  $('#b-no').onclick = () => { bPrev = null; out.innerHTML = ''; };
  $('#b-ok').onclick = async () => {
    if (!await ask({ title: T('Сохранить график маршрутов?', 'Зберегти графік маршрутів?'), ok: T('Сохранить', 'Зберегти'),
      text: T('Проверка листов сразу начнёт работать по нему. Прежний график останется в истории — его можно вернуть.', 'Перевірка листів одразу почне працювати за ним. Попередній графік залишиться в історії — його можна повернути.') })) return;
    try { const r = await api('/logist/book', { method: 'POST', body: { action: 'save', file: bPrev.file, data: bPrev.data } }); bookCache = r; bPrev = null; out.innerHTML = ''; toast(T('График сохранён', 'Графік збережено')); drawBook(r); }
    catch (ex) { toast(ex.message); }
  };
}

// ═══ Данные 1С (только администратор) ═════════════════════
let syncBusy = false;
async function viewData1c() {
  $('#view').innerHTML = `<div class="hd"><div><h1>${T('Данные 1С', 'Дані 1С')}</h1><div class="sub">${T('Клиенты из 1С (метод GetListOfClients). Загружаются сами каждую ночь в 03:15; при необходимости — кнопкой или файлом (ответ метода, сохранённый из браузера). Лимит 1С: не чаще раза в минуту, 3 раза в час, 20 в сутки.', 'Клієнти з 1С (метод GetListOfClients). Завантажуються самі щоночі о 03:15; за потреби — кнопкою або файлом (відповідь методу, збережена з браузера). Ліміт 1С: не частіше разу на хвилину, 3 рази на годину, 20 на добу.')}</div></div>
    <div class="bar"><label class="btn" id="up1c-l"><input type="file" id="up1c" accept=".json,.txt" hidden>${T('Загрузить файл', 'Завантажити файл')}</label><button class="btn pri" type="button" id="sync-go" ${syncBusy ? 'disabled' : ''}>${syncBusy ? T('Загружаю из 1С…', 'Завантажую з 1С…') : T('Загрузить сейчас', 'Завантажити зараз')}</button></div></div>
    <div id="d1-res"><div class="loading">${T('Загружаю…', 'Завантажую…')}</div></div>`;
  $('#up1c').onchange = async e => {
    const f = e.target.files[0]; if (!f) return; e.target.value = '';
    let items = null;
    try {
      const d = JSON.parse((await f.text()).replace(/^\uFEFF/, ''));
      const find = o => { if (items || !o) return; if (Array.isArray(o)) { if (o.length && o[0] && o[0].client_ID !== undefined) items = o; else o.forEach(find); }
        else if (typeof o === 'object') { if (Array.isArray(o.items)) items = o.items; else Object.values(o).forEach(find); } };
      find(d);
    } catch (_) {}
    if (!items || !items.length) return toast(T('В файле нет клиентов. Нужен ответ GetListOfClients, сохранённый из браузера', 'У файлі немає клієнтів. Потрібна відповідь GetListOfClients, збережена з браузера'));
    if (!await ask({ title: T('Загрузить клиентов из файла?', 'Завантажити клієнтів з файлу?'), ok: T('Загрузить', 'Завантажити'),
      text: `${esc(f.name)} · ${T('клиентов', 'клієнтів')}: <b>${items.length}</b>. ${T('Запросы к 1С не тратятся.', 'Запити до 1С не витрачаються.')}` })) return;
    $('#up1c-l').classList.add('dis'); toast(T('Загружаю…', 'Завантажую…'));
    try { const r = await api('/logist/admin/clients-upload', { method: 'POST', body: { items } }); toast(T(`Готово: ${r.total} клиентов, новых ${r.added}, изменилось ${r.changed}`, `Готово: ${r.total} клієнтів, нових ${r.added}, змінилося ${r.changed}`)); }
    catch (ex) { toast(ex.message); }
    viewData1c();
  };
  $('#sync-go').onclick = async () => {
    if (!await ask({ title: T('Загрузить клиентов из 1С сейчас?', 'Завантажити клієнтів з 1С зараз?'), ok: T('Загрузить', 'Завантажити'),
      text: T('Займёт до пары минут. Это один из 20 разрешённых запросов к 1С в сутки — без нужды лучше дождаться ночной загрузки.', 'Займе до кількох хвилин. Це один із 20 дозволених запитів до 1С на добу — без потреби краще дочекатися нічного завантаження.') })) return;
    syncBusy = true; viewData1c();
    try { const r = await api('/logist/admin/clients-sync', { method: 'POST' }); toast(T(`Готово: ${r.total} клиентов, новых ${r.added}, изменилось ${r.changed}`, `Готово: ${r.total} клієнтів, нових ${r.added}, змінилося ${r.changed}`)); }
    catch (e) { toast(e.message); }
    syncBusy = false; if ((location.hash || '').slice(1) === 'data1c') viewData1c();
  };
  try {
    const d = await api('/logist/admin/clients');
    const lo = d.last_ok, dur = x => x.finished_at ? Math.max(1, Math.round((new Date(x.finished_at) - new Date(x.started_at)) / 1000)) + T(' с', ' с') : '—';
    const SRC = { schedule: T('ночью', 'вночі'), manual: T('кнопкой', 'кнопкою'), file: T('файлом', 'файлом') };
    const ST = { ok: `<span class="pill ok">${T('успешно', 'успішно')}</span>`, error: `<span class="pill er">${T('ошибка', 'помилка')}</span>`, running: `<span class="pill">${T('идёт', 'триває')}</span>` };
    const fields = lo && lo.fields ? Object.entries(lo.fields).sort((a, b) => b[1].filled - a[1].filled) : [];
    const pct = n => d.clients ? Math.round(n / (lo.total || d.clients) * 100) : 0;
    $('#d1-res').innerHTML = `<div class="kpi"><div><b>${d.clients}</b>${T('клиентов в базе', 'клієнтів у базі')}</div>
      <div><b>${lo ? fmtDT(lo.finished_at) : '—'}</b>${T('последняя загрузка', 'останнє завантаження')}${lo ? ' · ' + SRC[lo.source] : ''}</div>
      <div><b>${lo ? '+' + lo.added + ' / ' + lo.changed : '—'}</b>${T('новых / изменилось', 'нових / змінилося')}</div>
      <div><b>${d.calls_hour}/3 · ${d.calls_day}/20</b>${T('запросов к 1С: за час · за сутки', 'запитів до 1С: за годину · за добу')}</div></div>
      ${d.running ? `<div class="note">${T('Загрузка идёт…', 'Завантаження триває…')}</div>` : ''}
      <div class="panel"><h2>${T('Какие поля приходят из 1С', 'Які поля приходять з 1С')}</h2>
      ${fields.length ? `<div class="tw"><table><thead><tr><th>${T('Поле', 'Поле')}</th><th>${T('Заполнено', 'Заповнено')}</th><th>${T('Пример', 'Приклад')}</th></tr></thead><tbody>
        ${fields.map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="nw">${v.filled} <span class="mu">(${pct(v.filled)}%)</span></td><td class="small">${esc(String(v.sample || '—').replace(/^"|"$/g, ''))}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="mu">${T('Загрузок ещё не было', 'Завантажень ще не було')}</div>`}</div>
      <div class="panel"><h2>${T('История загрузок', 'Історія завантажень')}</h2>
      ${d.log.length ? `<div class="tw"><table><thead><tr><th>${T('Начало', 'Початок')}</th><th>${T('Как', 'Як')}</th><th>${T('Итог', 'Підсумок')}</th><th>${T('Клиентов', 'Клієнтів')}</th><th>${T('Новых / изм.', 'Нових / змін.')}</th><th>${T('Длилась', 'Тривало')}</th><th>${T('Ошибка', 'Помилка')}</th></tr></thead><tbody>
        ${d.log.map(x => `<tr><td class="nw">${fmtDT(x.started_at)}</td><td>${SRC[x.source] || esc(x.source)}${x.who ? ' · ' + esc(x.who) : ''}</td><td>${ST[x.status] || esc(x.status)}</td>
          <td>${x.total ?? '—'}</td><td>${x.total !== null && x.total !== undefined ? '+' + x.added + ' / ' + x.changed : '—'}</td><td>${dur(x)}</td><td class="small">${esc(trSrv(x.error) || '')}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="mu">${T('Пусто', 'Порожньо')}</div>`}</div>`;
  } catch (e) { $('#d1-res').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}

// ═══ Пользователи (только администратор) ═════════════════
function genPassword() { const abc = 'abcdefghjkmnpqrstuvwxyz23456789'; const a = new Uint32Array(8); crypto.getRandomValues(a); return Array.from(a, x => abc[x % abc.length]).join(''); }
async function viewUsers(d) {
  if (!d) {
    $('#view').innerHTML = `<div class="hd"><div><h1>${T('Пользователи', 'Користувачі')}</h1><div class="sub">${T('Логисты и администраторы помощника. Отдельно от «Зеніт-Авто.фото»', 'Логісти й адміністратори помічника. Окремо від «Зеніт-Авто.фото»')}</div></div></div>
      <div class="panel"><h2>${T('Добавить', 'Додати')}</h2><form class="form" id="u-f">
        <label>${T('Имя и фамилия', 'Імʼя та прізвище')}<input class="in" id="u-name" required></label>
        <label>${T('Логин', 'Логін')}<input class="in" id="u-login" autocapitalize="none" spellcheck="false" placeholder="${T('латиница', 'латиниця')}" required></label>
        <label>Пароль<span class="pass"><input class="in" id="u-pass" required><button class="btn sm" type="button" id="u-gen">${T('Придумать', 'Згенерувати')}</button></span></label>
        <label>${T('Роль', 'Роль')}<select class="in" id="u-role"><option value="logist">${roleName('logist')}</option><option value="admin">${roleName('admin')}</option></select></label>
      </form><button class="btn pri" type="button" id="u-add">${T('Добавить', 'Додати')}</button><div id="u-creds" class="mt"></div></div>
      <div id="u-res"><div class="loading">${T('Загружаю…', 'Завантажую…')}</div></div>`;
    $('#u-pass').value = genPassword();
    $('#u-gen').onclick = () => { $('#u-pass').value = genPassword(); };
    $('#u-add').onclick = async () => {
      const body = { action: 'create', full_name: $('#u-name').value.trim(), login: $('#u-login').value.trim().toLowerCase(), password: $('#u-pass').value, role: $('#u-role').value };
      try { const r = await api('/logist/admin/user-action', { method: 'POST', body });
        $('#u-creds').innerHTML = `<div class="creds">${T('Готово. Передайте: ссылка', 'Готово. Передайте: посилання')} <code>${esc(location.href.split('#')[0])}</code> · ${T('логин', 'логін')} <code>${esc(body.login)}</code> · пароль <code>${esc(body.password)}</code></div>`;
        $('#u-name').value = ''; $('#u-login').value = ''; $('#u-pass').value = genPassword(); drawUsers(r.users);
      } catch (e) { $('#u-creds').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
    };
  }
  try { const r = await api('/logist/admin/users'); drawUsers(r.users); } catch (e) { $('#u-res').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
}
function drawUsers(list) {
  $('#u-res').innerHTML = `<div class="tw"><table><thead><tr><th>${T('Имя', 'Імʼя')}</th><th>${T('Логин', 'Логін')}</th><th>${T('Роль', 'Роль')}</th><th>${T('Был', 'Був')}</th><th>${T('Статус', 'Статус')}</th><th></th></tr></thead><tbody>
    ${list.map(u => `<tr><td><b>${esc(u.full_name)}</b></td><td class="mono">${esc(u.login)}</td><td>${esc(roleName(u.role))}</td><td>${fmtDT(u.last_seen_at)}</td>
      <td>${u.is_active ? `<span class="pill ok">${T('активен', 'активний')}</span>` : `<span class="pill er">${T('заблокирован', 'заблокований')}</span>`}</td>
      <td><span class="uacts"><button class="btn sm" type="button" data-ua="password" data-id="${u.id}">${T('Новый пароль', 'Новий пароль')}</button>
      ${Auth.user && u.id === Auth.user.id ? '' : `<button class="btn sm" type="button" data-ua="${u.is_active ? 'block' : 'unblock'}" data-id="${u.id}">${u.is_active ? T('Заблокировать', 'Заблокувати') : T('Разблокировать', 'Розблокувати')}</button>`}</span></td></tr>`).join('')}
    </tbody></table></div>`;
  $('#u-res').onclick = async e => {
    const b = e.target.closest('[data-ua]'); if (!b) return;
    const body = { action: b.dataset.ua, id: b.dataset.id };
    const name = b.closest('tr').querySelector('b').textContent;
    if (body.action === 'password') { body.password = genPassword(); if (!await ask({ title: T('Задать новый пароль?', 'Задати новий пароль?'), text: esc(name) + T(': старый пароль перестанет работать, вход на других устройствах закроется.', ': старий пароль перестане працювати, вхід на інших пристроях закриється.'), ok: T('Задать пароль', 'Задати пароль') })) return; }
    else if (!await ask(body.action === 'block'
      ? { title: T('Заблокировать пользователя?', 'Заблокувати користувача?'), text: esc(name) + T(' больше не сможет войти.', ' більше не зможе увійти.'), ok: T('Заблокировать', 'Заблокувати'), danger: true }
      : { title: T('Разблокировать пользователя?', 'Розблокувати користувача?'), text: esc(name) + T(' снова сможет войти.', ' знову зможе увійти.'), ok: T('Разблокировать', 'Розблокувати') })) return;
    try { const r = await api('/logist/admin/user-action', { method: 'POST', body }); drawUsers(r.users);
      if (body.password) $('#u-creds').innerHTML = `<div class="creds">${T('Новый пароль', 'Новий пароль')}: <code>${esc(body.password)}</code> — ${T('передайте пользователю', 'передайте користувачу')}</div>`;
    } catch (ex) { toast(ex.message); }
  };
}

// ─── запуск ───────────────────────────────────────────────
drawChrome();
async function boot() {
  if (!Auth.token) return showLogin();
  drawWho();
  try { const d = await api('/logist/auth/me'); Auth.save(Auth.token, d.user); enterApp(); }
  catch (e) { if (!Auth.token) return; if (e.status === 403) { Auth.clear(); return showLogin(e.message); } enterApp(); }
}
boot();
</script>
</body>
